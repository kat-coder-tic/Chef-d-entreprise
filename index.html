                            <div className="action-buttons">
                                <button className="btn btn-secondary" onClick={backToScenarios}>← Changer d'entreprise</button>
                                <button className="btn btn-primary" onClick={startGame}>Analyser la situation →</button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* DIAGNOSTIC */
            if (gameState.phase === 'diagnostic') {
                const ind = gameState.indicators;
                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 {gameState.scenario?.name}</h1>
                            <p>Diagnostic initial de l'entreprise</p>
                        </div>
                        <div className="diagnostic-screen">
                            <h2 className="phase-title">📊 Diagnostic stratégique</h2>
                            <p style={{color:'#666',marginBottom:'20px',fontSize:'0.95em'}}>
                                Analysez la situation de votre entreprise avant de prendre vos premières décisions. Identifiez les forces, faiblesses, opportunités et menaces (SWOT).
                            </p>
                            <div className="diag-grid">
                                <div className="diag-card">
                                    <h4>💰 Situation financière</h4>
                                    {[['ca','CA (croissance)'],['tresorerie','Trésorerie'],['endettement','Endettement']].map(([k,l]) => (
                                        <div key={k} className="diag-item">
                                            <span>{l}</span>
                                            <span className={`diag-value ${diagClass(k, ind[k])}`}>{Math.round(ind[k])}{INDICATOR_META[k].unit}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="diag-card">
                                    <h4>🎯 Position commerciale</h4>
                                    {[['partMarche','Part de marché'],['clients','Satisfaction clients'],['image','Image de marque']].map(([k,l]) => (
                                        <div key={k} className="diag-item">
                                            <span>{l}</span>
                                            <span className={`diag-value ${diagClass(k, ind[k])}`}>{Math.round(ind[k])}{INDICATOR_META[k].unit}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="diag-card">
                                    <h4>👥 Capital humain</h4>
                                    {[['salaries','Satisfaction salariés'],['productivite','Productivité']].map(([k,l]) => (
                                        <div key={k} className="diag-item">
                                            <span>{l}</span>
                                            <span className={`diag-value ${diagClass(k, ind[k])}`}>{Math.round(ind[k])}{INDICATOR_META[k].unit}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="diag-card">
                                    <h4>🏆 Position stratégique</h4>
                                    {[['innovation','Innovation'],['competitivite','Compétitivité']].map(([k,l]) => (
                                        <div key={k} className="diag-item">
                                            <span>{l}</span>
                                            <span className={`diag-value ${diagClass(k, ind[k])}`}>{Math.round(ind[k])}{INDICATOR_META[k].unit}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div style={{background:'#fff3cd',border:'2px solid #ffc107',borderRadius:'12px',padding:'20px',maxWidth:'700px',margin:'10px auto'}}>
                                <strong>🎯 Rappel de l'objectif :</strong> {gameState.scenario?.objectiveLine}
                            </div>
                            <div className="action-buttons">
                                <button className="btn btn-primary" onClick={startPlaying}>Commencer – Trimestre 1 →</button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* PLAYING */
            if (gameState.phase === 'playing') {
                const ind = gameState.indicators;
                const tresoPercent = Math.min(100, (ind.tresorerie / 150) * 100);
                const tresoClass = tresoPercent > 55 ? 'budget-high' : tresoPercent > 30 ? 'budget-medium' : 'budget-low';

                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 {gameState.scenario?.name}</h1>
                            <p>Dirigez votre entreprise vers le succès</p>
                        </div>

                        {/* Barre de progression */}
                        <div className="quarter-info">
                            <span>📅 Trimestre {gameState.quarter} / {gameState.totalQuarters}</span>
                            <div style={{display:'flex',flexDirection:'column',gap:'4px',flex:1,minWidth:0}}>
                                <span style={{fontSize:'0.85em',opacity:0.9}}>🎯 {gameState.scenario?.objectives}</span>
                                {/* Barres de progression vers l'objectif */}
                                {(gameState.scenario?.objectiveKeys || []).map(k => {
                                    const meta = INDICATOR_META[k];
                                    const val = Math.round(ind[k]);
                                    const target = (gameState.scenario?.objectiveTargets || {})[k] || 65;
                                    const pct = Math.min(100, (val / target) * 100);
                                    const color = pct >= 100 ? '#38ef7d' : pct >= 60 ? '#ffc107' : '#e74c3c';
                                    return (
                                        <div key={k} style={{display:'flex',alignItems:'center',gap:'6px',fontSize:'0.78em'}}>
                                            <span style={{whiteSpace:'nowrap',opacity:0.9}}>{meta?.icon} {val}/{target}</span>
                                            <div style={{flex:1,height:'6px',background:'rgba(255,255,255,0.2)',borderRadius:'3px',overflow:'hidden',minWidth:'60px'}}>
                                                <div style={{height:'100%',width:`${pct}%`,background:color,borderRadius:'3px',transition:'width 0.5s'}}/>
                                            </div>
                                            {pct >= 100 && <span style={{color:'#38ef7d',fontSize:'0.9em'}}>✓</span>}
                                        </div>
                                    );
                                })}
                            </div>
                            <div className="budget-bar-container">
                                <div className="budget-bar-label">💰 Trésorerie : {Math.round(ind.tresorerie)}</div>
                                <div className="budget-bar">
                                    <div className={`budget-bar-fill ${tresoClass}`} style={{width:`${tresoPercent}%`}}></div>
                                </div>
                            </div>
                            {timerEnabled && activeTab === 'decisions' && (
                                <span style={{display:'contents'}} className="timer-in-bar">{renderTimer()}</span>
                            )}
                        </div>

                        {/* Tableau de bord intelligent */}
                        {(() => {
                            const sc = gameState.scenario;
                            const objectiveKeys = sc?.objectiveKeys || [];
                            const alwaysKeys = ['tresorerie', ...objectiveKeys];

                            // Find keys that just turned red this quarter
                            const prevEntry = gameState.history.length >= 2
                                ? gameState.history[gameState.history.length - 2]
                                : null;
                            const alertKeys = prevEntry
                                ? Object.keys(INDICATOR_META).filter(k => {
                                    const prevVal = prevEntry.indicators[k];
                                    const curVal = ind[k];
                                    const good = INDICATOR_META[k].higherBetter !== false;
                                    // just entered bad zone (below 40 for positive indicators)
                                    if (good) return prevVal >= 40 && curVal < 40;
                                    return prevVal <= 60 && curVal > 60;
                                  })
                                : [];

                            const visibleKeys = showAllIndicators
                                ? Object.keys(INDICATOR_META)
                                : [...new Set([...alwaysKeys, ...alertKeys])];

                            const hiddenCount = Object.keys(INDICATOR_META).length - visibleKeys.length;

                            return (
                                <div>
                                    <div className="dashboard">
                                        {visibleKeys.map(key => {
                                            const meta = INDICATOR_META[key];
                                            const val = ind[key];
                                            const trend = getTrend(key);
                                            const isObjective = objectiveKeys.includes(key);
                                            return (
                                                <div key={key} className={`indicator ${indicatorClass(key, val)}`}
                                                     style={isObjective ? {border:'2px solid #f39c12', boxShadow:'0 0 0 2px #fff3cd'} : {}}>
                                                    {isObjective && <div style={{fontSize:'0.65em',color:'#f39c12',fontWeight:700,marginBottom:'3px'}}>🎯 OBJECTIF</div>}
                                                    {alertKeys.includes(key) && !isObjective && <div style={{fontSize:'0.65em',color:'#e74c3c',fontWeight:700,marginBottom:'3px'}}>🚨 ALERTE</div>}
                                                    <div className="indicator-label">{meta.icon} {meta.label}</div>
                                                    <div className="indicator-value">{Math.round(val)}<small style={{fontSize:'0.45em',color:'#999'}}>{meta.unit}</small></div>
                                                    <span className={`indicator-trend ${trendClass(trend)}`}>{trendLabel(trend)}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    {!showAllIndicators && hiddenCount > 0 && (
                                        <div style={{textAlign:'center',padding:'6px 0 10px'}}>
                                            <button onClick={() => setShowAllIndicators(true)}
                                                    style={{background:'none',border:'1px solid #dee2e6',borderRadius:'20px',padding:'4px 14px',fontSize:'0.8em',color:'#888',cursor:'pointer'}}>
                                                + {hiddenCount} indicateur{hiddenCount>1?'s':''} masqué{hiddenCount>1?'s':''} — Tout voir
                                            </button>
                                        </div>
                                    )}
                                    {showAllIndicators && (
                                        <div style={{textAlign:'center',padding:'6px 0 10px'}}>
                                            <button onClick={() => setShowAllIndicators(false)}
                                                    style={{background:'none',border:'1px solid #dee2e6',borderRadius:'20px',padding:'4px 14px',fontSize:'0.8em',color:'#888',cursor:'pointer'}}>
                                                ↑ Réduire
                                            </button>
                                        </div>
                                    )}
                                </div>
                            );
                        })()}

                        {/* Onglets */}
                        <div className="tab-bar">
                            {[
                                {k:'decisions', l:'⚡ Décisions'},
                                {k:'dashboard', l:'📈 Tableau de bord'},
                                {k:'journal',   l:'📜 Journal'},
                                {k:'glossary',  l:'📚 Glossaire'},
                            ].map(({k,l}) => (
                                <button key={k} className={`tab-btn${activeTab===k?' active':''}`}
                                        onClick={()=>setActiveTab(k)}>{l}</button>
                            ))}
                        </div>

                        {/* Contenu onglet Décisions */}
                        {activeTab === 'decisions' && (
                        <div className="game-phase">
                            <h3 className="phase-title">⚡ Décisions – Trimestre {gameState.quarter}</h3>

                            {/* Timer mobile — visible uniquement sur petit écran */}
                            {timerEnabled && (
                                <div className="timer-mobile-wrap">
                                    <span style={{fontWeight:700,fontSize:'0.9em'}}>⚡ Trimestre {gameState.quarter} — Décidez vite !</span>
                                    {renderTimer()}
                                </div>
                            )}

                            <div className="selection-info">
                                {gameState.selectedDecisions.length}/3 décisions sélectionnées · Coût total : {totalCost} · Trésorerie après : ~{Math.round(ind.tresorerie - totalCost)}
                                {timerEnabled && (gameState.speedBonusTotal || 0) > 0 && (
                                    <span style={{marginLeft:'10px',color:'#f39c12',fontWeight:700}}>⚡ Bonus vitesse accumulé : +{gameState.speedBonusTotal} pts</span>
                                )}
                            </div>

                            {/* Conseils contextuels */}
                            {(() => {
                                const tips = generateAdvice();
                                if (tips.length === 0) return null;
                                const colors = {
                                    danger:  { bg:'#fdecea', border:'#e74c3c', color:'#b71c1c' },
                                    warning: { bg:'#fff8e1', border:'#ffc107', color:'#856404' },
                                    info:    { bg:'#e3f2fd', border:'#2196f3', color:'#0d47a1' },
                                };
                                return (
                                    <div style={{display:'flex',flexDirection:'column',gap:'6px',marginBottom:'12px'}}>
                                        {tips.map((tip, i) => {
                                            const c = colors[tip.type] || colors.info;
                                            return (
                                                <div key={i} style={{padding:'9px 14px',borderRadius:'8px',fontSize:'0.88em',background:c.bg,color:c.color,borderLeft:`4px solid ${c.border}`,display:'flex',gap:'8px',alignItems:'center'}}>
                                                    <span style={{fontSize:'1.1em'}}>{tip.icon}</span>
                                                    <span>{tip.text}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                );
                            })()}

                            {/* Filtres */}
                            <div className="filter-bar">
                                <span style={{fontWeight:'600',color:'#555',alignSelf:'center',marginRight:'4px'}}>Filtrer :</span>
                                {[
                                    {k:'all',l:'🗂️ Tout'},
                                    {k:'rh',l:'👥 RH'},
                                    {k:'finance',l:'💰 Finance'},
                                    {k:'commercial',l:'📣 Commercial'},
                                    {k:'innovation',l:'🔬 Innovation'},
                                    {k:'strategie',l:'🌍 Stratégie'},
                                    {k:'strategique',l:'Stratégique'},
                                    {k:'tactique',l:'Tactique'},
                                    {k:'operationnelle',l:'Opérationnelle'},
                                ].map(({k,l}) => (
                                    <button key={k} className={`filter-btn${gameState.activeFilter===k?' active':''}`} onClick={()=>setFilter(k)}>{l}</button>
                                ))}
                            </div>

                            <div className="decisions-grid">
                                {filteredDecisions.map(dec => {
                                    const isSelected = gameState.selectedDecisions.includes(dec.id);
                                    const realCost = dec.cost > 0 ? dec.cost : 0;
                                    const cantAfford = !isSelected && realCost > 0 && ind.tresorerie < realCost;
                                    const maxReached = !isSelected && gameState.selectedDecisions.length >= 3;
                                    const cooldownUntil = (gameState.cooldowns || {})[dec.id];
                                    const onCooldown = !isSelected && cooldownUntil > gameState.quarter;
                                    const isDisabled = cantAfford || maxReached || onCooldown;
                                    const catMeta = CATEGORY_META[dec.category];
                                    const dtMeta = DT_META[dec.decisionType];
                                    const hasDelayed = !!DELAYED_EFFECTS[dec.id];

                                    return (
                                        <div key={dec.id}
                                             className={`decision-card${isSelected?' selected':''}${isDisabled?' disabled':''}`}
                                             onClick={() => !isDisabled && toggleDecision(dec.id)}>
                                            <div className="decision-cost">
                                                {dec.cost > 0 ? `−${dec.cost}` : dec.cost === 0 ? 'Gratuit' : `+${Math.abs(dec.cost)} 💰`}
                                            </div>
                                            <div className="decision-tags">
                                                <span className={`tag ${catMeta.tagClass}`}>{catMeta.label}</span>
                                                <span className={`tag ${dtMeta.tagClass}`}>{dtMeta.label}</span>
                                                <span className="tag tag-notion">📚 {dec.notion}</span>
                                                {hasDelayed && <span style={{display:'inline-block',padding:'3px 9px',borderRadius:'20px',fontSize:'0.72em',fontWeight:'bold',background:'#e8f5e9',color:'#1b5e20'}}>💫 Effet différé</span>}
                                            </div>
                                            {onCooldown && (
                                                <div style={{fontSize:'0.78em',color:'#e67e22',fontWeight:700,marginBottom:'6px',background:'#fff3e0',padding:'4px 8px',borderRadius:'6px',display:'inline-block'}}>
                                                    ⏳ Déjà utilisée — disponible au T{cooldownUntil}
                                                </div>
                                            )}
                                            <div className="decision-name">{dec.icon} {dec.name}</div>
                                            <div className="decision-description">{dec.description}</div>
                                            <div className="decision-impacts">
                                                {Object.entries(dec.impacts).map(([k, v]) => {
                                                    const good = INDICATOR_META[k]?.higherBetter !== false;
                                                    const isPos = good ? v > 0 : v < 0;
                                                    const sign = v > 0 ? '+' : '';
                                                    return (
                                                        <span key={k} className={`impact-badge ${isPos?'impact-positive':'impact-negative'}`}>
                                                            {impactLabels[k]} {sign}{v}
                                                        </span>
                                                    );
                                                })}
                                                {hasDelayed && (
                                                    <span style={{padding:'3px 8px',borderRadius:'10px',fontSize:'0.72em',fontWeight:600,background:'#e8f5e9',color:'#1b5e20'}}>
                                                        💫 +bonus T+1
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="action-buttons">
                                <button className="btn btn-secondary" onClick={backToScenarios}>← Menu</button>
                                <button className="btn btn-primary" onClick={() => executeQuarterWithBonus()}>
                                    {timerEnabled && timeLeft > 0
                                        ? `✅ Valider – T${gameState.quarter} (+${calcSpeedBonus(timeLeft)} pts vitesse)`
                                        : `Valider le trimestre ${gameState.quarter} →`}
                                </button>
                            </div>
                        </div>
                        )}

                        {/* Contenu onglet Tableau de bord */}
                        {activeTab === 'dashboard' && renderChart()}

                        {/* Contenu onglet Journal */}
                        {activeTab === 'journal' && renderJournal()}

                        {/* Contenu onglet Glossaire */}
                        {activeTab === 'glossary' && renderGlossary()}

                        {/* Boutons de navigation quand hors décisions */}
                        {activeTab !== 'decisions' && (
                            <div className="action-buttons">
                                <button className="btn btn-secondary" onClick={backToScenarios}>← Menu</button>
                                <button className="btn btn-primary" onClick={()=>setActiveTab('decisions')}>
                                    ⚡ Retour aux décisions
                                </button>
                            </div>
                        )}

                        {/* Bouton toggle chrono flottant */}
                        <button className="timer-mode-btn" onClick={toggleTimer}>
                            {timerEnabled ? '⏱ Chrono ON' : '⏱ Chrono OFF'}
                        </button>
                    </div>
                );
            }

            /* BILAN NARRATIF */
            if (gameState.phase === 'narrative') {
                const stories = gameState.narrativeStories || [];
                const quarter = gameState.quarter > 1 ? gameState.quarter - 1 : gameState.quarter;
                const ind = gameState.indicators;
                const prevEntry = gameState.history.length >= 2 ? gameState.history[gameState.history.length - 2] : null;
                const prevInd = prevEntry ? prevEntry.indicators : gameState.scenario?.initialState;

                const continueNarrative = () => {
                    setGameState(prev => ({ ...prev, phase: prev.pendingPhase || 'playing', narrativeStories: [] }));
                };

                const headlines = [
                    'Ce qui s\'est passé ce trimestre…',
                    'Dans les coulisses de votre entreprise…',
                    'Le bilan du terrain…',
                    'La réalité derrière les chiffres…',
                    'Ce que vos tableaux Excel ne montrent pas…',
                ];
                const headline = headlines[(quarter - 1) % headlines.length];

                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 {gameState.scenario?.name}</h1>
                            <p>Bilan – Trimestre {quarter}</p>
                        </div>
                        <div className="narrative-screen">
                            <div className="narrative-quarter-label">📅 Trimestre {quarter} / {gameState.totalQuarters}</div>
                            <div className="narrative-headline">{headline}</div>

                            {stories.length > 0 ? (
                                <div className="narrative-stories">
                                    {stories.map((s, i) => (
                                        <div key={i} className={`narrative-story ${s.tone}`}
                                             style={{animationDelay: `${i * 0.12}s`}}>
                                            <div className="narrative-story-icon">{s.icon}</div>
                                            <div>
                                                <div className="narrative-story-text">{s.text}</div>
                                                {s.notion && <div className="narrative-story-notion">📚 {s.notion}</div>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="narrative-stories">
                                    <div className="narrative-story neutral">
                                        <div className="narrative-story-icon">📋</div>
                                        <div className="narrative-story-text">Trimestre sans événement majeur. Vos équipes exécutent le plan. Les indicateurs évoluent progressivement.</div>
                                    </div>
                                </div>
                            )}

                            {/* Effets différés annoncés */}
                            {Object.keys(gameState.pendingBonus || {}).length > 0 && gameState.pendingPhase === 'playing' && (
                                <div style={{background:'#e8f5e9',border:'2px solid #28a745',borderRadius:'10px',padding:'12px 16px',marginBottom:'20px',display:'flex',gap:'10px',alignItems:'flex-start'}}>
                                    <span style={{fontSize:'1.5em'}}>💫</span>
                                    <div>
                                        <div style={{fontWeight:700,color:'#1b5e20',marginBottom:'4px'}}>Effets différés en cours</div>
                                        <div style={{fontSize:'0.88em',color:'#2e7d32'}}>
                                            Vos décisions de ce trimestre continueront d'agir au prochain :&nbsp;
                                            {Object.entries(gameState.pendingBonus).map(([k, v]) => (
                                                <span key={k} style={{marginRight:'8px',fontWeight:600}}>
                                                    {INDICATOR_META[k]?.icon} {INDICATOR_META[k]?.label} {v > 0 ? '+' : ''}{v}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Deltas des indicateurs */}
                            {prevInd && (
                                <div>
                                    <div style={{fontSize:'0.8em',fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'10px'}}>Impact sur vos indicateurs</div>
                                    <div className="narrative-deltas">
                                        {Object.keys(INDICATOR_META).map(k => {
                                            const delta = Math.round(ind[k] - prevInd[k]);
                                            if (delta === 0) return null;
                                            const good = INDICATOR_META[k].higherBetter !== false;
                                            const isPos = good ? delta > 0 : delta < 0;
                                            return (
                                                <span key={k} className="narrative-delta"
                                                      style={{background: isPos ? '#d4edda' : '#f8d7da', color: isPos ? '#155724' : '#721c24'}}>
                                                    {INDICATOR_META[k].icon} {INDICATOR_META[k].label} {delta > 0 ? '+' : ''}{delta}
                                                </span>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            <div className="action-buttons">
                                <button className="btn btn-primary" onClick={continueNarrative}>
                                    {gameState.pendingPhase === 'results' ? 'Voir le bilan final →' :
                                     gameState.pendingPhase === 'midterm' ? 'Bilan mi-parcours →' :
                                     `Trimestre ${gameState.quarter} →`}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* ÉVÉNEMENT */
            if (gameState.phase === 'event') {
                const ev = gameState.eventTriggered;
                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 {gameState.scenario?.name}</h1>
                            <p>Trimestre {gameState.quarter} – Événement imprévu</p>
                        </div>
                        <div className="event-modal" style={{position:'relative',background:'none',padding:'40px'}}>
                            <div className="event-content" style={{maxWidth:'680px',margin:'0 auto'}}>
                                <div className="event-icon">{ev?.icon}</div>
                                <div className="event-title">{ev?.name}</div>
                                <div className="event-description">{ev?.description}</div>
                                <div className="event-impacts-list">
                                    {ev && Object.entries(ev.impacts).map(([k, v]) => {
                                        const good = INDICATOR_META[k]?.higherBetter !== false;
                                        const isPos = good ? v > 0 : v < 0;
                                        const sign = v > 0 ? '+' : '';
                                        return (
                                            <span key={k} className={`impact-badge ${isPos?'impact-positive':'impact-negative'}`} style={{padding:'6px 14px',fontSize:'0.9em'}}>
                                                {impactLabels[k]} {sign}{v}
                                            </span>
                                        );
                                    })}
                                </div>
                                {ev?._reduced && ev?._resilienceMsg && (
                                    <div style={{background:'#e8f5e9',border:'2px solid #28a745',borderRadius:'10px',padding:'12px 16px',marginBottom:'16px',fontSize:'0.88em',color:'#1b5e20',display:'flex',gap:'8px',alignItems:'center'}}>
                                        <span style={{fontSize:'1.3em'}}>🛡️</span>
                                        <span><strong>Vos décisions passées ont atténué le choc !</strong><br/>{ev._resilienceMsg}</span>
                                    </div>
                                )}
                                <p style={{color:'#888',fontSize:'0.88em',marginBottom:'20px'}}>
                                    💡 Comment votre stratégie peut-elle limiter ce risque ou exploiter cette opportunité ?
                                </p>
                                <button className="btn btn-primary" onClick={continueAfterEvent}>Continuer →</button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* MI-PARCOURS */
            if (gameState.phase === 'midterm') {
                const ind = gameState.indicators;
                const sc = gameState.scenario;
                const goalMet = sc?.check?.(ind);
                const midRecs = [];
                if (ind.tresorerie < 40) midRecs.push({ text: '⚠️ Trésorerie critique ! Envisagez un plan de réduction des coûts ou un emprunt.', warn: true });
                if (ind.salaries < 45) midRecs.push({ text: '⚠️ Vos salariés sont démotivés. Investissez en GRH (revalorisation, conditions de travail).', warn: true });
                if (ind.innovation < 30) midRecs.push({ text: '⚠️ Votre niveau d\'innovation est très bas. Risque de perte de compétitivité.', warn: true });
                if (ind.partMarche < 12) midRecs.push({ text: '⚠️ Votre part de marché est faible. Relancez votre stratégie commerciale.', warn: true });
                if (ind.endettement > 70) midRecs.push({ text: '⚠️ Endettement élevé. Évitez de nouveaux emprunts, privilégiez l\'autofinancement.', warn: true });
                if (ind.ca > 60) midRecs.push({ text: '✅ Bonne croissance du CA ! Maintenez votre dynamique commerciale.', warn: false });
                if (ind.salaries > 65) midRecs.push({ text: '✅ Vos équipes sont motivées. Le capital humain est un actif précieux.', warn: false });
                if (ind.innovation > 60) midRecs.push({ text: '✅ Votre niveau d\'innovation vous positionne favorablement pour la 2ᵉ année.', warn: false });
                if (midRecs.length === 0) midRecs.push({ text: '→ Situation équilibrée. Restez vigilant sur vos indicateurs les plus fragiles.', warn: false });

                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 Bilan de Mi-Parcours</h1>
                            <p>Fin de la 1ʳᵉ année – Analyse stratégique</p>
                        </div>
                        <div className="midterm-screen">
                            <h2 className="phase-title">📊 Rapport annuel – Fin d'année 1</h2>

                            <div style={{background: goalMet ? '#d4edda' : '#fff3cd', border:`2px solid ${goalMet?'#28a745':'#ffc107'}`, borderRadius:'12px', padding:'18px', marginBottom:'25px', fontSize:'1em'}}>
                                <strong>{goalMet ? '🟢 Vous êtes sur la bonne trajectoire !' : '🟡 Vous n\'avez pas encore atteint l\'objectif.'}</strong>
                                <br/><span style={{color:'#555'}}>{sc?.objectiveLine}</span>
                            </div>

                            <div className="midterm-grid">
                                <div className="midterm-card">
                                    <h4>📈 Indicateurs clés actuels</h4>
                                    {Object.entries(ind).map(([k, v]) => (
                                        <div key={k} className="diag-item">
                                            <span style={{fontSize:'0.88em'}}>{INDICATOR_META[k]?.icon} {INDICATOR_META[k]?.label}</span>
                                            <span className={`diag-value ${diagClass(k, v)}`}>{Math.round(v)}{INDICATOR_META[k]?.unit}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="midterm-card">
                                    <h4>💡 Recommandations pour l'année 2</h4>
                                    {midRecs.map((r, i) => (
                                        <div key={i} className={`midterm-rec${r.warn?' warning':''}`}>{r.text}</div>
                                    ))}
                                </div>
                                <div className="midterm-card">
                                    <h4>📜 Décisions prises (1ʳᵉ année)</h4>
                                    {gameState.history.slice(0,4).map(h => (
                                        <div key={h.quarter} style={{marginBottom:'8px',fontSize:'0.88em'}}>
                                            <strong style={{color:'#1e3c72'}}>T{h.quarter}</strong> :&nbsp;
                                            {h.decisions.length > 0 ? h.decisions.map(d => d.name).join(', ') : 'Aucune décision'}
                                            {h.event && <span style={{color:'#e74c3c'}}> · ⚡ {h.event.name}</span>}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="action-buttons">
                                <button className="btn btn-primary" onClick={continueFromMidterm}>Commencer l'année 2 →</button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* RÉSULTATS */
            if (gameState.phase === 'results') {
                const score = calculateScore();
                const ind = gameState.indicators;
                const sc = gameState.scenario;
                const objectiveReached = sc?.check?.(ind);
                const isNewRecord = gameState.isNewRecord;
                const hs = highscores[sc?.id];
                const hsHistory = hs?.history || [];

                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 Bilan Final</h1>
                            <p>{sc?.name} – Résultats après 2 ans</p>
                        </div>
                        <div className="results-screen">
                            <h2 className="results-title">
                                {objectiveReached ? '🎉 Objectif atteint !' : '📋 Fin de mandat'}
                            </h2>

                            {/* Record banner */}
                            {isNewRecord && (
                                <div className="record-banner">
                                    <span className="record-icon">🏆</span>
                                    <div>
                                        <div>Nouveau record personnel !</div>
                                        <div style={{fontSize:'0.85em',fontWeight:400,opacity:0.9}}>Meilleur score sur ce scénario : {score.total}/100</div>
                                    </div>
                                </div>
                            )}

                            {/* Stars */}
                            <div style={{marginBottom:'20px'}}>
                                {renderStars(score.total, '2.2em')}
                                <div style={{color:'#888',fontSize:'0.88em',marginTop:'4px'}}>
                                    {getStars(score.total) === 3 ? 'Performance exceptionnelle !' : getStars(score.total) === 2 ? 'Bonne gestion, tu peux encore progresser !' : getStars(score.total) === 1 ? 'Des efforts supplémentaires sont nécessaires.' : 'Reprends ta stratégie depuis le début.'}
                                </div>
                            </div>

                            <div style={{background: objectiveReached?'#d4edda':'#f8d7da', border:`2px solid ${objectiveReached?'#28a745':'#dc3545'}`, borderRadius:'12px', padding:'18px', maxWidth:'600px', margin:'0 auto 30px', fontSize:'1.05em'}}>
                                {objectiveReached
                                    ? <><strong>✅ Bravo !</strong> Vous avez rempli votre mission : {sc?.objectiveLine}</>
                                    : <><strong>❌ Objectif non atteint.</strong> {sc?.objectiveLine}<br/><span style={{fontSize:'0.9em',color:'#666',marginTop:'6px',display:'block'}}>Analysez vos choix et retentez le scénario avec une stratégie différente.</span></>
                                }
                            </div>

                            <div className="results-grid">
                                {[
                                    {key:'ca', label:'Performance CA', icon:'📈',
                                     explain: `CA final ${Math.round(ind.ca)} vs départ ${sc?.initialState?.ca || 0}. Chaque point gagné vaut 3 pts de score.`},
                                    {key:'tresorerie', label:'Santé financière', icon:'💰',
                                     explain: `Trésorerie idéale = 100. Vous avez ${Math.round(ind.tresorerie)}. Score = 100 − écart à 100.`},
                                    {key:'partiesPrenantes', label:'Parties prenantes', icon:'🤝',
                                     explain: `Clients (${Math.round(ind.clients)}) vs Salariés (${Math.round(ind.salaries)}). Plus l'écart est faible, plus le score est élevé.`},
                                    {key:'competitivite', label:'Position stratégique', icon:'🏆',
                                     explain: `Moyenne Part de marché (${Math.round(ind.partMarche)}%) + Compétitivité (${Math.round(ind.competitivite)}).`},
                                ].map(({key, label, icon, explain}) => {
                                    const s = score[key];
                                    return (
                                        <div key={key} className="result-card">
                                            <div style={{fontSize:'2em'}}>{icon}</div>
                                            <div style={{fontWeight:'bold',color:'#555',marginBottom:'5px'}}>{label}</div>
                                            <div className={`result-score ${scoreClass(s)}`}>{s}/100</div>
                                            <div style={{color:'#888',fontSize:'0.85em'}}>{scoreText(s)}</div>
                                            <div style={{color:'#aaa',fontSize:'0.78em',marginTop:'6px',lineHeight:'1.4',textAlign:'left',background:'#f8f9fa',padding:'6px 8px',borderRadius:'6px'}}>
                                                🧮 {explain}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Score global */}
                            <div className={`result-card ${scoreClass(score.total)}`} style={{maxWidth:'400px',margin:'0 auto 30px',padding:'30px',borderRadius:'16px',boxShadow:'0 8px 20px rgba(0,0,0,0.1)'}}>
                                <div style={{fontSize:'1.1em',fontWeight:'bold',color:'#333',marginBottom:'6px'}}>Score global</div>
                                <div style={{fontSize:'4em',fontWeight:'900'}} className={scoreClass(score.total)}>{score.total}/100</div>
                                <div style={{fontSize:'1.2em',marginTop:'4px'}} className={scoreClass(score.total)}>{scoreText(score.total)}</div>
                                {renderStars(score.total)}
                                {(gameState.speedBonusTotal || 0) > 0 && (
                                    <div style={{marginTop:'10px',fontSize:'0.82em',color:'#f39c12',fontWeight:700}}>
                                        ⚡ Bonus vitesse inclus : +{gameState.speedBonusTotal} pts
                                    </div>
                                )}
                                {hs?.best && !isNewRecord && (
                                    <div style={{marginTop:'10px',fontSize:'0.85em',color:'#888'}}>
                                        🏆 Ton record : <strong>{hs.best}/100</strong>
                                        {score.total >= hs.best - 4 && score.total < hs.best && (
                                            <span style={{color:'#e67e22',marginLeft:'6px'}}>Si proche !</span>
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* Historique des parties */}
                            {hsHistory.length > 1 && (
                                <div style={{marginBottom:'30px'}}>
                                    <h3 style={{color:'#1e3c72',marginBottom:'14px'}}>📊 Tes {hsHistory.length} dernières parties sur ce scénario</h3>
                                    <table className="highscore-table">
                                        <thead>
                                            <tr><th>#</th><th>Date</th><th>Score</th><th>Étoiles</th><th>Objectif</th></tr>
                                        </thead>
                                        <tbody>
                                            {hsHistory.map((e, i) => (
                                                <tr key={i} className={i === 0 ? 'rank-1' : ''}>
                                                    <td>{i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}`}</td>
                                                    <td>{e.date}</td>
                                                    <td><strong>{e.score}/100</strong></td>
                                                    <td style={{letterSpacing:'1px'}}>{[1,2,3].map(s => <span key={s} style={{color: s <= getStars(e.score) ? '#f39c12' : '#ddd'}}>★</span>)}</td>
                                                    <td>{e.objectiveReached ? '✅' : '❌'}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {(() => {
                                        const first = hsHistory[hsHistory.length - 1].score;
                                        const latest = hsHistory[0].score;
                                        const prog = latest - first;
                                        if (prog > 0) return <div style={{fontSize:'0.88em',color:'#28a745',marginTop:'8px'}}>📈 Tu as progressé de +{prog} points depuis ta première partie !</div>;
                                        if (prog < 0) return <div style={{fontSize:'0.88em',color:'#e67e22',marginTop:'8px'}}>Essaie une stratégie différente pour améliorer ton score.</div>;
                                        return null;
                                    })()}
                                </div>
                            )}

                            {/* Tableau de bord final */}
                            <div style={{marginBottom:'30px'}}>
                                <h3 style={{color:'#1e3c72',marginBottom:'15px'}}>📊 Indicateurs finaux</h3>
                                <div className="dashboard">
                                    {Object.keys(INDICATOR_META).map(key => {
                                        const meta = INDICATOR_META[key];
                                        const val = ind[key];
                                        const init = sc?.initialState[key] || 0;
                                        const delta = Math.round(val - init);
                                        return (
                                            <div key={key} className={`indicator ${indicatorClass(key, val)}`}>
                                                <div className="indicator-label">{meta.icon} {meta.label}</div>
                                                <div className="indicator-value">{Math.round(val)}<small style={{fontSize:'0.45em',color:'#999'}}>{meta.unit}</small></div>
                                                <span className={`indicator-trend ${delta > 0 ? (meta.higherBetter!==false?'trend-up':'trend-down') : delta < 0 ? (meta.higherBetter!==false?'trend-down':'trend-up') : 'trend-stable'}`}>
                                                    {delta > 0 ? '▲' : delta < 0 ? '▼' : '→'} {delta > 0 ? '+' : ''}{delta}
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div style={{background:'#e8f5e9',border:'2px solid #28a745',borderRadius:'12px',padding:'20px',maxWidth:'700px',margin:'0 auto 30px',textAlign:'left'}}>
                                <strong style={{color:'#1e3c72',display:'block',marginBottom:'10px'}}>🎓 Retour pédagogique</strong>
                                <ul style={{color:'#555',fontSize:'0.9em',lineHeight:'1.8',paddingLeft:'18px'}}>
                                    <li>Quelles décisions ont eu le plus d'impact positif ? Pourquoi ?</li>
                                    <li>Avez-vous bien équilibré décisions stratégiques, tactiques et opérationnelles ?</li>
                                    <li>Comment avez-vous géré les événements imprévus ?</li>
                                    <li>Quel lien faites-vous avec les notions du programme Management STMG ?</li>
                                    <li>Refaites le scénario avec une stratégie différente et comparez les résultats.</li>
                                </ul>
                            </div>

                            <div style={{background:'#fff8e1',border:'2px solid #f39c12',borderRadius:'12px',padding:'20px',maxWidth:'680px',margin:'0 auto 24px'}}>
                                <div style={{fontWeight:700,color:'#856404',marginBottom:'12px'}}>📤 Partager mes résultats avec le professeur</div>
                                <div style={{display:'flex',gap:'10px',alignItems:'center',flexWrap:'wrap',marginBottom:'10px'}}>
                                    <input
                                        type="text"
                                        placeholder="Nom de l'équipe (ex: Équipe 1)"
                                        value={teamName}
                                        onChange={e=>setTeamName(e.target.value)}
                                        style={{flex:1,padding:'8px 12px',border:'1px solid #dee2e6',borderRadius:'6px',fontSize:'0.9em',minWidth:'180px'}}
                                    />
                                    <button className="share-btn" onClick={generateShareLink}>
                                        🔗 Générer le lien
                                    </button>
                                </div>
                                {shareUrl && (
                                    <div className="share-link-box">
                                        <input readOnly value={shareUrl} onClick={e=>e.target.select()}/>
                                        <button className={`copy-btn${copied?' copied':''}`} onClick={copyLink}>
                                            {copied ? '✅ Copié !' : '📋 Copier'}
                                        </button>
                                    </div>
                                )}
                                <div style={{fontSize:'0.78em',color:'#aaa',marginTop:'4px'}}>Envoyez ce lien au prof par mail, ENT ou messagerie.</div>
                            </div>

                            <div className="action-buttons">
                                <button className="btn btn-secondary" onClick={backToScenarios}>← Choisir un autre scénario</button>
                                <button className="btn" style={{background:'#1e3c72',color:'white'}} onClick={()=>{setActiveTab('journal');setGameState(prev=>({...prev,phase:'playing',quarter:9}));}}>📜 Voir le journal</button>
                                <button className="btn btn-primary" onClick={resetGame}>🔄 Rejouer ce scénario</button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* RÉSULTAT PARTAGÉ (vue lecture seule depuis URL) */
            if (gameState.phase === 'shared_result' && sharedResult) {
                const d = sharedResult;
                const s = d.score;
                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 Résultats de {d.team}</h1>
                            <p>{d.scenario} · {d.date}</p>
                        </div>
                        <div className="results-screen">
                            <h2 className="results-title">{d.obj ? '🎉 Objectif atteint !' : '📋 Fin de mandat'}</h2>
                            <div className={`result-card ${scoreClass(s)}`} style={{maxWidth:'400px',margin:'0 auto 28px',padding:'28px',borderRadius:'16px',boxShadow:'0 8px 20px rgba(0,0,0,0.1)'}}>
                                <div style={{fontSize:'1em',fontWeight:'bold',color:'#333',marginBottom:'6px'}}>{d.team}</div>
                                <div style={{fontSize:'3.5em',fontWeight:'900'}} className={scoreClass(s)}>{s}/100</div>
                                {renderStars(s)}
                                {d.speedBonus > 0 && <div style={{fontSize:'0.82em',color:'#f39c12',marginTop:'6px'}}>⚡ Bonus vitesse : +{d.speedBonus} pts</div>}
                            </div>
                            <div className="results-grid" style={{maxWidth:'700px',margin:'0 auto 28px'}}>
                                {[['📈 CA','ca'],['💰 Tréso','tresorerie'],['🤝 Parties prenantes','pp'],['🏆 Compétitivité','comp']].map(([l,k])=>(
                                    <div key={k} className="result-card">
                                        <div style={{fontSize:'1.3em'}}>{l.split(' ')[0]}</div>
                                        <div style={{fontWeight:'bold',color:'#555',fontSize:'0.9em'}}>{l.split(' ').slice(1).join(' ')}</div>
                                        <div className={`result-score ${scoreClass(d.scores?.[k]||0)}`}>{d.scores?.[k]||0}/100</div>
                                    </div>
                                ))}
                            </div>
                            {d.ind && (
                                <div style={{maxWidth:'700px',margin:'0 auto 20px'}}>
                                    <div style={{fontWeight:700,color:'#1e3c72',marginBottom:'10px'}}>📊 Indicateurs finaux</div>
                                    <div style={{display:'flex',flexWrap:'wrap',gap:'8px'}}>
                                        {Object.entries(d.ind).map(([k,v])=>(
                                            <span key={k} className="team-ind-pill"
                                                  style={{background:v>=65?'#d4edda':v>=40?'#fff3cd':'#f8d7da',
                                                          color:v>=65?'#155724':v>=40?'#856404':'#721c24',padding:'5px 12px',fontSize:'0.82em'}}>
                                                {INDICATOR_META[k]?.icon} {INDICATOR_META[k]?.label} : <strong>{v}</strong>
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            )}
                            <div style={{color:'#aaa',fontSize:'0.82em',marginTop:'20px'}}>Vue lecture seule — partagée par {d.team}</div>
                        </div>
                    </div>
                );
            }

            /* TABLEAU DE BORD PROFESSEUR */
            if (gameState.phase === 'teacher') {
                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 Chef d'Entreprise</h1>
                            <p>Tableau de bord Professeur</p>
                        </div>
                        {renderTeacherDashboard()}
                        <div className="action-buttons">
                            <button className="btn btn-primary" onClick={backToScenarios}>← Retour aux scénarios</button>
                        </div>
                    </div>
                );
            }

            /* GLOSSAIRE STANDALONE */
            if (gameState.phase === 'glossary_standalone') {
                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 Chef d'Entreprise</h1>
                            <p>Glossaire des notions STMG</p>
                        </div>
                        {renderGlossary()}
                        <div className="action-buttons">
                            <button className="btn btn-primary" onClick={backToScenarios}>← Retour aux scénarios</button>
                        </div>
                    </div>
                );
            }

            return <div>Chargement…</div>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Game />);
    </script>
</body>
</html>
