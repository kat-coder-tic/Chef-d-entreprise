<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef d'Entreprise : Stratégie & Management – Jeu pédagogique STMG</title>
    <meta property="og:title" content="Chef d'Entreprise : Stratégie & Management – Jeu pédagogique STMG">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(135deg, #1e3c72 0%, #11998e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .game-header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .game-header p { font-size: 1.1em; opacity: 0.9; }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            padding: 25px;
            background: #f8f9fa;
        }

        .indicator {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }
        .indicator:hover { transform: translateY(-3px); box-shadow: 0 8px 12px rgba(0,0,0,0.15); }
        .indicator-label { font-size: 0.78em; color: #666; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .indicator-value { font-size: 2em; font-weight: bold; margin-bottom: 4px; }
        .indicator-trend { font-size: 0.8em; padding: 3px 8px; border-radius: 20px; display: inline-block; }
        .trend-up { background: #d4edda; color: #155724; }
        .trend-down { background: #f8d7da; color: #721c24; }
        .trend-stable { background: #fff3cd; color: #856404; }
        .indicator-bad .indicator-value { color: #dc3545; }
        .indicator-warning .indicator-value { color: #ffc107; }
        .indicator-good .indicator-value { color: #28a745; }

        .game-phase { padding: 30px; }
        .phase-title {
            font-size: 1.8em;
            color: #1e3c72;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #11998e;
        }

        .decisions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 18px;
            margin-top: 20px;
        }

        .decision-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .decision-card:hover { border-color: #11998e; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(17,153,142,0.25); }
        .decision-card.selected { border-color: #11998e; background: linear-gradient(135deg, #11998e15, #38ef7d10); box-shadow: 0 6px 20px rgba(17,153,142,0.35); }
        .decision-card.disabled { opacity: 0.45; cursor: not-allowed; }

        .decision-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

        .tag { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 0.72em; font-weight: bold; text-transform: uppercase; letter-spacing: 0.4px; }
        .tag-rh { background: #27ae60; color: white; }
        .tag-finance { background: #2980b9; color: white; }
        .tag-commercial { background: #e67e22; color: white; }
        .tag-innovation { background: #8e44ad; color: white; }
        .tag-strategie { background: #16a085; color: white; }

        .tag-strategique { background: #e74c3c; color: white; }
        .tag-tactique { background: #f39c12; color: white; }
        .tag-operationnelle { background: #27ae60; color: white; }

        .tag-notion { background: #f0f0f0; color: #555; font-style: italic; }

        .decision-name { font-size: 1.1em; font-weight: bold; margin-bottom: 8px; color: #333; }
        .decision-description { font-size: 0.88em; color: #666; margin-bottom: 12px; line-height: 1.5; }

        .decision-impacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .impact-badge { padding: 3px 8px; border-radius: 10px; font-size: 0.72em; font-weight: 600; }
        .impact-positive { background: #d4edda; color: #155724; }
        .impact-negative { background: #f8d7da; color: #721c24; }

        .decision-cost {
            position: absolute;
            top: 10px; right: 10px;
            background: #1e3c72;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: bold;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #dee2e6;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.2s;
        }
        .filter-btn:hover { border-color: #11998e; }
        .filter-btn.active { background: #11998e; color: white; border-color: #11998e; }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 36px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-primary { background: linear-gradient(135deg, #11998e, #38ef7d); color: white; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(17,153,142,0.4); }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover:not(:disabled) { background: #5a6268; }
        .btn-danger { background: #dc3545; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .event-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .event-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .event-icon { font-size: 4em; margin-bottom: 20px; }
        .event-title { font-size: 1.8em; color: #1e3c72; margin-bottom: 15px; font-weight: bold; }
        .event-description { font-size: 1.05em; color: #666; line-height: 1.6; margin-bottom: 25px; }
        .event-impacts-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 25px; }

        .results-screen { padding: 40px; text-align: center; }
        .results-title { font-size: 2.2em; color: #1e3c72; margin-bottom: 30px; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; margin: 35px 0; }
        .result-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .result-score { font-size: 2.8em; font-weight: bold; margin: 10px 0; }
        .score-excellent { color: #28a745; }
        .score-good { color: #17a2b8; }
        .score-average { color: #ffc107; }
        .score-poor { color: #dc3545; }

        .diagnostic-screen { padding: 30px; }
        .diag-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin: 25px 0; }
        .diag-card { background: #f8f9fa; padding: 20px; border-radius: 12px; border-left: 4px solid #11998e; }
        .diag-card h4 { font-size: 1em; color: #1e3c72; margin-bottom: 12px; font-weight: bold; }
        .diag-item { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 0.9em; }
        .diag-value { font-weight: bold; padding: 2px 10px; border-radius: 12px; }
        .diag-good { background: #d4edda; color: #155724; }
        .diag-warning { background: #fff3cd; color: #856404; }
        .diag-bad { background: #f8d7da; color: #721c24; }

        .scenario-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .scenario-card {
            background: white;
            border: 3px solid #dee2e6;
            border-radius: 16px;
            padding: 28px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        .scenario-card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.15); }
        .scenario-card.completed { border-color: #28a745; }
        .scenario-card .scenario-name { font-size: 1.3em; font-weight: bold; margin-bottom: 10px; }
        .scenario-card .scenario-desc { font-size: 0.9em; color: #666; margin-bottom: 15px; line-height: 1.5; }
        .scenario-card .scenario-difficulty { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8em; font-weight: bold; margin-bottom: 12px; }
        .diff-easy { background: #d4edda; color: #155724; }
        .diff-medium { background: #fff3cd; color: #856404; }
        .diff-hard { background: #f8d7da; color: #721c24; }
        .diff-vhard { background: #f5c6cb; color: #491217; }
        .scenario-objective { font-size: 0.85em; color: #444; background: #f8f9fa; padding: 10px; border-radius: 8px; margin-top: 10px; }
        .completed-badge { position: absolute; top: 12px; right: 12px; background: #28a745; color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.75em; font-weight: bold; }

        /* ── SCORE / RECORD SYSTEM ── */
        .stars-row { display: flex; gap: 3px; justify-content: center; margin: 6px 0; font-size: 1.4em; }
        .star-filled { color: #f39c12; }
        .star-empty  { color: #ddd; }

        .record-banner {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            max-width: 520px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 700;
            font-size: 1.05em;
            box-shadow: 0 4px 16px rgba(243,156,18,0.4);
            animation: pulse 0.6s ease-out;
        }
        @keyframes pulse {
            0%   { transform: scale(0.95); opacity: 0; }
            60%  { transform: scale(1.03); }
            100% { transform: scale(1);    opacity: 1; }
        }
        .record-icon { font-size: 2em; }

        .highscore-table {
            width: 100%;
            max-width: 640px;
            margin: 0 auto 28px;
            border-collapse: collapse;
            font-size: 0.88em;
        }
        .highscore-table th {
            background: #1e3c72;
            color: white;
            padding: 9px 14px;
            text-align: left;
        }
        .highscore-table td {
            padding: 9px 14px;
            border-bottom: 1px solid #f0f0f0;
        }
        .highscore-table tr:nth-child(even) td { background: #f8f9fa; }
        .highscore-table .rank-1 td { background: #fff8e1; font-weight: 700; }

        .scenario-best {
            margin-top: 10px;
            font-size: 0.82em;
            color: #555;
        }
        .scenario-best .stars-row { justify-content: flex-start; font-size: 1em; margin: 3px 0 0; }
        .pb-badge {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 2px 8px;
            font-size: 0.78em;
            font-weight: 700;
            margin-left: 6px;
        }

        .quarter-info {
            background: linear-gradient(135deg, #1e3c72, #11998e);
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .quarter-info span { font-weight: bold; font-size: 1em; }
        .budget-bar-container { width: 150px; }
        .budget-bar-label { font-size: 0.78em; margin-bottom: 4px; opacity: 0.9; }
        .budget-bar { height: 12px; background: rgba(255,255,255,0.3); border-radius: 6px; overflow: hidden; }
        .budget-bar-fill { height: 100%; border-radius: 6px; transition: width 0.5s; }
        .budget-high { background: #38ef7d; }
        .budget-medium { background: #ffc107; }
        .budget-low { background: #e74c3c; }

        .midterm-screen { padding: 35px; }
        .midterm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 25px 0; }
        .midterm-card { background: #f8f9fa; padding: 20px; border-radius: 12px; }
        .midterm-card h4 { font-size: 1em; color: #1e3c72; margin-bottom: 12px; font-weight: bold; border-bottom: 2px solid #11998e; padding-bottom: 6px; }
        .midterm-rec { padding: 10px; background: white; border-radius: 8px; border-left: 3px solid #11998e; margin: 8px 0; font-size: 0.88em; color: #444; line-height: 1.5; }
        .midterm-rec.warning { border-left-color: #e74c3c; }

        .start-screen { padding: 40px; text-align: center; }
        .start-screen h2 { font-size: 2em; color: #1e3c72; margin-bottom: 20px; }
        .context-card { background: #f0f9ff; border: 2px solid #11998e; border-radius: 16px; padding: 30px; max-width: 800px; margin: 0 auto 30px; text-align: left; }
        .context-card h3 { color: #1e3c72; margin-bottom: 15px; font-size: 1.3em; }
        .context-card p { color: #555; line-height: 1.7; margin-bottom: 12px; }
        .context-card ul { color: #555; line-height: 1.8; padding-left: 20px; }

        .progress-bar-container { margin: 20px 0; }
        .progress-bar { height: 8px; background: #dee2e6; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #11998e, #38ef7d); border-radius: 4px; transition: width 0.5s; }

        .history-timeline { margin: 20px 0; }
        .history-item { display: flex; gap: 15px; padding: 12px 0; border-bottom: 1px solid #f0f0f0; font-size: 0.88em; align-items: start; }
        .history-quarter { background: #1e3c72; color: white; padding: 4px 10px; border-radius: 20px; font-weight: bold; white-space: nowrap; flex-shrink: 0; }

        .selection-info { background: #e8f5e9; border: 2px solid #28a745; border-radius: 12px; padding: 15px 20px; margin-bottom: 20px; font-size: 0.95em; color: #155724; font-weight: 600; }
        .selection-info.warning { background: #fff3cd; border-color: #ffc107; color: #856404; }

        .treso-info { background: #e3f2fd; border: 2px solid #2196f3; border-radius: 12px; padding: 12px 18px; margin-bottom: 15px; font-size: 0.9em; color: #0d47a1; }

        /* ═══════════════════════════════════════
           RESPONSIVE – MOBILE & TABLETTE
           ═══════════════════════════════════════ */

        @media (max-width: 768px) {

            /* ── Layout général ── */
            body { padding: 0; }
            .game-container { border-radius: 0; }

            /* ── Header ── */
            .game-header { padding: 16px; }
            .game-header h1 { font-size: 1.3em; margin-bottom: 4px; }
            .game-header p  { font-size: 0.85em; }

            /* ── Barre de progression ── */
            .quarter-info {
                flex-direction: column;
                align-items: flex-start;
                padding: 10px 14px;
                gap: 6px;
            }
            .quarter-info span { font-size: 0.88em; }
            .budget-bar-container { width: 100%; }

            /* ── Dashboard indicateurs ── */
            .dashboard {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                padding: 10px;
            }
            .indicator { padding: 10px 6px; }
            .indicator-label { font-size: 0.68em; }
            .indicator-value { font-size: 1.5em; }
            .indicator-trend { font-size: 0.7em; }

            /* ── Onglets ── */
            .tab-bar { padding: 0 8px; overflow-x: auto; flex-wrap: nowrap; }
            .tab-btn  { padding: 10px 12px; font-size: 0.8em; white-space: nowrap; }

            /* ── Phase de jeu ── */
            .game-phase   { padding: 14px; }
            .phase-title  { font-size: 1.2em; }

            /* ── Filtres ── */
            .filter-bar {
                padding: 10px;
                gap: 6px;
                overflow-x: auto;
                flex-wrap: nowrap;
            }
            .filter-btn { padding: 6px 10px; font-size: 0.78em; white-space: nowrap; flex-shrink: 0; }

            /* ── Cartes décisions ── */
            .decisions-grid { grid-template-columns: 1fr; gap: 12px; }
            .decision-card  { padding: 14px; }
            .decision-name  { font-size: 1em; }
            .decision-description { font-size: 0.82em; }
            .tag { font-size: 0.68em; padding: 2px 7px; }
            .decision-cost { font-size: 0.72em; padding: 3px 8px; }
            .impact-badge  { font-size: 0.68em; }

            /* ── Boutons d'action ── */
            .action-buttons {
                flex-direction: column;
                padding: 14px;
                gap: 10px;
            }
            .btn { padding: 12px 20px; font-size: 0.9em; width: 100%; text-align: center; }

            /* ── Écran scénarios ── */
            .scenario-grid { grid-template-columns: 1fr; gap: 14px; }
            .results-screen { padding: 16px; }
            .results-title  { font-size: 1.5em; margin-bottom: 18px; }
            .results-grid   { grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 18px 0; }
            .result-card    { padding: 14px; }
            .result-score   { font-size: 2em; }

            /* ── Diagnostic ── */
            .diagnostic-screen { padding: 16px; }
            .diag-grid { grid-template-columns: 1fr; gap: 12px; }

            /* ── Démarrage ── */
            .start-screen  { padding: 18px; }
            .start-screen h2 { font-size: 1.4em; }
            .context-card  { padding: 16px; }

            /* ── Mi-parcours ── */
            .midterm-screen { padding: 16px; }
            .midterm-grid   { grid-template-columns: 1fr; }

            /* ── Narratif ── */
            .narrative-screen   { padding: 16px; }
            .narrative-headline { font-size: 1.2em; margin-bottom: 16px; }
            .narrative-story    { padding: 12px 14px; gap: 10px; }
            .narrative-story-icon { font-size: 1.4em; }
            .narrative-story-text { font-size: 0.88em; }

            /* ── Événement ── */
            .event-content { padding: 24px 16px; }
            .event-icon    { font-size: 2.8em; margin-bottom: 12px; }
            .event-title   { font-size: 1.3em; }
            .event-description { font-size: 0.92em; }

            /* ── Tableau de bord (onglet) ── */
            .chart-wrap { padding: 12px; }
            .chart-svg-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

            /* ── Journal ── */
            .journal-wrap  { padding: 14px; }
            .journal-header { padding: 10px 12px; gap: 8px; }
            .journal-body  { padding: 12px; }

            /* ── Glossaire ── */
            .glossary-wrap { padding: 14px; }
            .glossary-grid { grid-template-columns: 1fr; }
            .glossary-cats { gap: 6px; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
            .glossary-cats .filter-btn { flex-shrink: 0; }

            /* ── Records ── */
            .record-banner { padding: 12px 16px; gap: 10px; font-size: 0.95em; }
            .record-icon   { font-size: 1.6em; }
            .highscore-table { font-size: 0.8em; }
            .highscore-table th, .highscore-table td { padding: 7px 8px; }

            /* ── Partage ── */
            .share-link-box { flex-direction: column; }
            .share-link-box input { width: 100%; }
            .copy-btn { width: 100%; text-align: center; padding: 10px; }

            /* ── Prof ── */
            .teacher-wrap { padding: 14px; }
            .team-grid    { grid-template-columns: 1fr; }
            .ranking-table { font-size: 0.78em; }
            .ranking-table th, .ranking-table td { padding: 7px 8px; }

            /* ── Chrono flottant ── */
            .timer-mode-btn { bottom: 12px; right: 12px; padding: 6px 12px; font-size: 0.75em; }

            /* ── Info sélection ── */
            .selection-info { font-size: 0.82em; padding: 10px 14px; }

            /* ── Tréso info ── */
            .treso-info { font-size: 0.82em; padding: 10px 14px; }
        }

        /* Petits mobiles */
        @media (max-width: 400px) {
            .dashboard { grid-template-columns: repeat(2, 1fr); }
            .results-grid { grid-template-columns: 1fr; }
            .tab-btn { padding: 8px 10px; font-size: 0.75em; }
            .game-header h1 { font-size: 1.1em; }
        }

        /* Timer dans la barre — caché sur mobile, affiché dans le header décisions */
        @media (max-width: 768px) {
            .timer-in-bar { display: none !important; }
            .timer-mobile-wrap {
                display: flex;
                align-items: center;
                gap: 12px;
                background: linear-gradient(135deg, #1e3c72, #11998e);
                color: white;
                padding: 8px 14px;
                justify-content: space-between;
            }
            .timer-mobile-wrap .timer-wrap { flex-direction: row; gap: 8px; }
        }
        @media (min-width: 769px) {

        /* ===================== COMPOSANT PRINCIPAL ===================== */
        function Game() {
            // Detect shared result URL on load
            const sharedResult = (() => {
                try {
                    const match = window.location.search.match(/[?&]r=([^&]+)/);
                    if (!match) return null;
                    const json = decodeURIComponent(escape(atob(match[1])));
                    return JSON.parse(json);
                } catch(e) { return null; }
            })();

            const [gameState, setGameState] = useState(() => {
                if (sharedResult) return { ...INITIAL_STATE, phase: 'shared_result' };
                try {
                    const saved = localStorage.getItem('chef-entreprise-game');
                    return saved ? JSON.parse(saved) : INITIAL_STATE;
                } catch(e) { return INITIAL_STATE; }
            });
            const [activeTab, setActiveTab] = useState('decisions');
            const [glossarySearch, setGlossarySearch] = useState('');
            const [glossaryCat, setGlossaryCat] = useState('all');
            const [hiddenLines, setHiddenLines] = useState({});
            const [showAllIndicators, setShowAllIndicators] = useState(false);

            /* ── TIMER ── */
            const TIMER_DURATION = 45;
            const [timerEnabled, setTimerEnabled] = useState(() => {
                try { return localStorage.getItem('chef-timer') !== 'off'; }
                catch(e) { return true; }
            });
            const [timeLeft, setTimeLeft] = useState(TIMER_DURATION);
            const [timerBonus, setTimerBonus] = useState(0); // accumulated speed bonus

            // Reset timer when quarter changes
            useEffect(() => {
                if (gameState.phase === 'playing') {
                    setTimeLeft(TIMER_DURATION);
                    setShowAllIndicators(false);
                }
            }, [gameState.quarter, gameState.phase]);

            // Countdown
            useEffect(() => {
                if (!timerEnabled || gameState.phase !== 'playing' || activeTab !== 'decisions') return;
                if (timeLeft <= 0) {
                    // Auto-validate when time runs out
                    executeQuarterWithBonus(0);
                    return;
                }
                const t = setTimeout(() => setTimeLeft(prev => prev - 1), 1000);
                return () => clearTimeout(t);
            }, [timeLeft, timerEnabled, gameState.phase, activeTab]);

            const toggleTimer = () => {
                const next = !timerEnabled;
                setTimerEnabled(next);
                localStorage.setItem('chef-timer', next ? 'on' : 'off');
            };

            // Speed bonus: up to +5 pts if validated with >20s left
            const calcSpeedBonus = (secondsLeft) => {
                if (secondsLeft >= 30) return 5;
                if (secondsLeft >= 20) return 3;
                if (secondsLeft >= 10) return 1;
                return 0;
            };

            const renderTimer = () => {
                const pct = timeLeft / TIMER_DURATION;
                const r = 22;
                const circ = 2 * Math.PI * r;
                const dash = circ * pct;
                const color = timeLeft > 20 ? '#38ef7d' : timeLeft > 10 ? '#ffc107' : '#e74c3c';
                const urgent = timeLeft <= 10;
                return (
                    <div className={`timer-wrap${urgent ? ' timer-urgent' : ''}`}>
                        <div className="timer-ring-wrap">
                            <svg width="52" height="52">
                                <circle cx="26" cy="26" r={r} fill="none" stroke="rgba(255,255,255,0.2)" strokeWidth="4"/>
                                <circle cx="26" cy="26" r={r} fill="none" stroke={color} strokeWidth="4"
                                        strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"
                                        style={{transition:'stroke-dasharray 1s linear, stroke 0.5s'}}/>
                            </svg>
                            <div className="timer-number" style={{color}}>{timeLeft}s</div>
                        </div>
                        <div className="timer-label">⏱ Chrono</div>
                        {timeLeft >= 20 && <div className="timer-bonus">+{calcSpeedBonus(timeLeft)} pts si vite</div>}
                    </div>
                );
            };

            /* ── HIGHSCORES (separate localStorage key, never reset with game) ── */
            const [highscores, setHighscores] = useState(() => {
                try { return JSON.parse(localStorage.getItem('chef-hs') || '{}'); }
                catch(e) { return {}; }
            });

            const saveHighscore = (scenarioId, score, objectiveReached) => {
                const now = new Date();
                const dateStr = now.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'2-digit' });
                const entry = { score, objectiveReached, date: dateStr, ts: now.getTime() };

                setHighscores(prev => {
                    const history = prev[scenarioId]?.history || [];
                    const newHistory = [entry, ...history].slice(0, 5); // keep last 5
                    const best = newHistory.reduce((b, e) => e.score > b.score ? e : b, newHistory[0]);
                    const updated = { ...prev, [scenarioId]: { best: best.score, history: newHistory } };
                    localStorage.setItem('chef-hs', JSON.stringify(updated));
                    return updated;
                });

                const prevBest = highscores[scenarioId]?.best || 0;
                return score > prevBest; // returns true if new record
            };

                    v: 1,
                    team: teamName || 'Équipe',
                    scenario: sc?.name || '',
                    scenarioId: sc?.id || '',

                    score: score.total,
                    scores: { ca: score.ca, tresorerie: score.tresorerie, pp: score.partiesPrenantes, comp: score.competitivite },

                    ind: Object.fromEntries(Object.keys(INDICATOR_META).map(k => [k, Math.round(ind[k])])),
                    decisions: gameState.history.flatMap(h => h.decisions.map(d => d.name)),
                    speedBonus: gameState.speedBonusTotal || 0,

                    const json = JSON.stringify(payload);
                    const b64 = btoa(unescape(encodeURIComponent(json)));

                const score = calculateScore();

                                <div className="team-grid">
                                    {teacherData.map((d, i) => {
                                        const color = scenarioColors[d.scenarioId] || '#11998e';
                                        return (
                                            <div key={i} className="team-card" style={{borderTopColor: color}}>
                                                <div className="team-header">
                                                    <div>
                                                        <div className="team-name">{d.team}</div>
                                                        <div style={{fontSize:'0.8em',color:'#888'}}>{d.scenario} · {d.date}</div>
                                                    </div>
                                                    <div style={{textAlign:'right'}}>
                                                        <div className={`team-score-big ${scoreClass(d.score)}`}>{d.score}<span style={{fontSize:'0.45em',color:'#aaa'}}>/100</span></div>
                                                        <div style={{letterSpacing:'2px'}}>{[1,2,3].map(s=><span key={s} style={{color:s<=getStars(d.score)?'#f39c12':'#ddd',fontSize:'1.1em'}}>★</span>)}</div>
                                                    </div>
                                                </div>

                                                {/* Sub-scores */}
                                                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px',marginBottom:'12px'}}>
                                                    {[
                                                        {k:'ca',l:'📈 CA',v:d.scores?.ca},
                                                        {k:'tresorerie',l:'💰 Tréso',v:d.scores?.tresorerie},
                                                        {k:'pp',l:'🤝 Parties prenantes',v:d.scores?.pp},
                                                        {k:'comp',l:'🏆 Compétitivité',v:d.scores?.comp},
                                                    ].map(({k,l,v}) => (
                                                        <div key={k} style={{background:'#f8f9fa',borderRadius:'8px',padding:'6px 10px',fontSize:'0.8em'}}>
                                                            <div style={{color:'#888'}}>{l}</div>
                                                            <div className={scoreClass(v||0)} style={{fontWeight:700}}>{v||0}/100</div>
                                                        </div>
                                                    ))}
                                                </div>

                                                {/* Indicateurs finaux */}
                                                <div style={{fontSize:'0.75em',color:'#888',fontWeight:600,marginBottom:'5px',textTransform:'uppercase',letterSpacing:'0.4px'}}>Indicateurs finaux</div>
                                                <div className="team-indicators">
                                                    {d.ind && Object.entries(d.ind).map(([k,v]) => (
                                                        <span key={k} className="team-ind-pill"
                                                              style={{background: v >= 65 ? '#d4edda' : v >= 40 ? '#fff3cd' : '#f8d7da',
                                                                      color: v >= 65 ? '#155724' : v >= 40 ? '#856404' : '#721c24'}}>
                                                            {INDICATOR_META[k]?.icon} {v}
                                                        </span>
                                                    ))}
                                                </div>

                                                {/* Decisions taken */}
                                                {d.decisions?.length > 0 && (
                                                    <div style={{marginTop:'10px',fontSize:'0.78em',color:'#555'}}>
                                                        <div style={{fontWeight:600,marginBottom:'4px',color:'#888',textTransform:'uppercase',letterSpacing:'0.4px'}}>Décisions prises</div>
                                                        {d.decisions.slice(0,6).join(' · ')}
                                                        {d.decisions.length > 6 && <span style={{color:'#aaa'}}> +{d.decisions.length - 6} autres</span>}
                                                    </div>
                                                )}

                                                <div style={{marginTop:'10px',fontSize:'0.78em',color: d.obj?'#28a745':'#dc3545',fontWeight:700}}>
                                                    {d.obj ? '✅ Objectif atteint' : '❌ Objectif non atteint'}
                                                    {d.speedBonus > 0 && <span style={{color:'#f39c12',marginLeft:'8px'}}>⚡ +{d.speedBonus} pts vitesse</span>}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Questions de débriefing */}
                                <div style={{marginTop:'30px',background:'#e8f5e9',border:'2px solid #28a745',borderRadius:'12px',padding:'20px'}}>
                                    <strong style={{color:'#1e3c72',display:'block',marginBottom:'10px'}}>🎓 Questions de débriefing suggérées</strong>
                                    <ul style={{color:'#555',fontSize:'0.9em',lineHeight:'2',paddingLeft:'18px'}}>
                                        <li>Quelle équipe a obtenu le meilleur score ? Quelles décisions ont fait la différence ?</li>
                                        <li>Comparez les stratégies des équipes ayant joué le même scénario. Pourquoi des résultats différents ?</li>
                                        <li>Quelles équipes ont bien équilibré décisions stratégiques, tactiques et opérationnelles ?</li>
                                        <li>Comment les événements imprévus ont-ils affecté les différentes stratégies ?</li>
                                        <li>Quel lien faites-vous entre les décisions prises et les notions du programme Management STMG ?</li>
                                    </ul>
                                </div>
                            </>
                        )}
                    </div>
                );
            };


            useEffect(() => {
                localStorage.setItem('chef-entreprise-game', JSON.stringify(gameState));
            }, [gameState]);

            /* ── Fonctions ── */
            const selectScenario = (id) => {
                const sc = SCENARIOS[id];
                setGameState({
                    ...INITIAL_STATE,
                    scenario: sc,
                    indicators: { ...sc.initialState },
                    phase: 'start',
                    completedScenarios: gameState.completedScenarios || []
                });
            };

            const startGame = () => setGameState(prev => ({ ...prev, phase: 'diagnostic' }));
            const startPlaying = () => setGameState(prev => ({ ...prev, quarter: 1, phase: 'playing' }));

            const toggleDecision = (id) => {
                setGameState(prev => {
                    const dec = DECISIONS.find(d => d.id === id);
                    if (!dec) return prev;
                    const cost = dec.cost > 0 ? dec.cost : 0;
                    const onCooldown = (prev.cooldowns || {})[id] > prev.quarter;
                    const selected = prev.selectedDecisions.includes(id)
                        ? prev.selectedDecisions.filter(x => x !== id)
                        : prev.selectedDecisions.length < 3 && prev.indicators.tresorerie >= cost && !onCooldown
                            ? [...prev.selectedDecisions, id]
                            : prev.selectedDecisions;
                    return { ...prev, selectedDecisions: selected };
                });
            };

            const executeQuarter = (speedBonus = 0) => {
                const selectedData = DECISIONS.filter(d => gameState.selectedDecisions.includes(d.id));
                let ind = { ...gameState.indicators };
                const currentQ = gameState.quarter;

                // ── 1. Appliquer les effets différés du trimestre précédent ──
                const pending = gameState.pendingBonus || {};
                const pendingApplied = {};
                Object.keys(pending).forEach(key => {
                    if (ind[key] !== undefined && pending[key] !== 0) {
                        pendingApplied[key] = pending[key];
                        ind[key] = key === 'tresorerie'
                            ? Math.max(0, Math.min(150, ind[key] + pending[key]))
                            : Math.max(0, Math.min(100, ind[key] + pending[key]));
                    }
                });

                // ── 2. Appliquer les décisions avec légère variabilité (±1-2 pts) ──
                selectedData.forEach(dec => {
                    Object.keys(dec.impacts).forEach(key => {
                        if (ind[key] !== undefined) {
                            const base = dec.impacts[key];
                            // Variabilité : ±1 sur petits impacts, ±2 sur grands
                            const variance = Math.abs(base) >= 4
                                ? Math.round((Math.random() - 0.5) * 4)
                                : Math.round((Math.random() - 0.5) * 2);
                            const actual = base + variance;
                            ind[key] = key === 'tresorerie'
                                ? Math.max(0, Math.min(150, ind[key] + actual))
                                : Math.max(0, Math.min(100, ind[key] + actual));
                        }
                    });
                    if (dec.cost > 0) ind.tresorerie = Math.max(0, ind.tresorerie - dec.cost);
                });

                // ── 3. Régénération trimestrielle de trésorerie ──
                const baseRenewal = 20;
                const caBonus = Math.max(0, (ind.ca - 50)) * 0.3;
                const pmBonus = Math.max(0, (ind.partMarche - 15)) * 0.2;
                const totalRenewal = Math.round(baseRenewal + caBonus + pmBonus);
                ind.tresorerie = Math.min(150, ind.tresorerie + totalRenewal);

                // ── 4. Préparer les effets différés pour le prochain trimestre ──
                const newPendingBonus = {};
                selectedData.forEach(dec => {
                    const delayed = DELAYED_EFFECTS[dec.id];
                    if (delayed) {
                        Object.keys(delayed).forEach(key => {
                            newPendingBonus[key] = (newPendingBonus[key] || 0) + delayed[key];
                        });
                    }
                });

                // ── 5. Mettre à jour les cooldowns ──
                const newCooldowns = {};
                Object.keys(gameState.cooldowns || {}).forEach(id => {
                    if ((gameState.cooldowns[id] || 0) > currentQ) newCooldowns[id] = gameState.cooldowns[id];
                });
                selectedData.forEach(dec => { newCooldowns[dec.id] = currentQ + 2; });

                // ── 6. Événement aléatoire avec résilience ──
                const evtProb = gameState.scenario?.eventProbability || 0.5;
                const shouldEvent = Math.random() < evtProb && currentQ < gameState.totalQuarters;
                const scenEvents = EVENTS.filter(e => !e.scenarios || e.scenarios.includes(gameState.scenario?.id));
                let randomEvent = shouldEvent && scenEvents.length > 0
                    ? scenEvents[Math.floor(Math.random() * scenEvents.length)]
                    : null;

                let resilienceMsg = null;
                if (randomEvent && !randomEvent.positive) {
                    const recentDecIds = gameState.history.slice(-3).flatMap(h => h.decisions.map(d => d.id));
                    const resilience = RESILIENCE_MAP[randomEvent.id] || [];
                    const active = resilience.filter(r => recentDecIds.includes(r.decId));
                    if (active.length > 0) {
                        const reduction = active.reduce((acc, r) => acc * r.reduce, 1);
                        resilienceMsg = active[0].msg;
                        randomEvent = {
                            ...randomEvent,
                            impacts: Object.fromEntries(
                                Object.entries(randomEvent.impacts).map(([k, v]) => [k, Math.round(v * reduction)])
                            ),
                            _reduced: true,
                            _resilienceMsg: resilienceMsg
                        };
                    }
                }

                if (randomEvent) {
                    Object.keys(randomEvent.impacts).forEach(key => {
                        if (ind[key] !== undefined) {
                            ind[key] = key === 'tresorerie'
                                ? Math.max(0, Math.min(150, ind[key] + randomEvent.impacts[key]))
                                : Math.max(0, Math.min(100, ind[key] + randomEvent.impacts[key]));
                        }
                    });
                }

                const newHistory = [...gameState.history, {
                    quarter: currentQ,
                    decisions: selectedData,
                    indicators: ind,
                    event: randomEvent,
                    revenue: totalRenewal,
                    pendingApplied: Object.keys(pendingApplied).length > 0 ? pendingApplied : null,
                }];

                const isMidterm = currentQ === 4;
                const isLast = currentQ >= gameState.totalQuarters;

                const baseUpdate = { cooldowns: newCooldowns };

                if (randomEvent) {
                    setGameState(prev => ({ ...prev, ...baseUpdate, indicators: ind, history: newHistory, eventTriggered: randomEvent, phase: 'event', pendingBonus: newPendingBonus }));
                } else if (isMidterm) {
                    const prevInd = gameState.history.length > 0 ? gameState.history[gameState.history.length-1].indicators : gameState.scenario?.initialState;
                    const stories = generateNarratives(ind, selectedData, prevInd);
                    setGameState(prev => ({ ...prev, ...baseUpdate, indicators: ind, history: newHistory, pendingPhase: 'midterm', narrativeStories: stories, phase: 'narrative', pendingBonus: newPendingBonus }));
                } else if (isLast) {
                    const finalScore = (() => {
                        const f = ind; const i2 = gameState.scenario?.initialState || {};
                        const caScore = Math.max(0, Math.min(100, (f.ca - (i2.ca||0)) * 3));
                        const tresoScore = Math.max(0, 100 - Math.abs(100 - f.tresorerie));
                        const ppScore = Math.max(0, 100 - Math.abs(f.clients - f.salaries));
                        const compScore = Math.max(0, (f.partMarche + f.competitivite) / 2);
                        const base = Math.round((caScore + tresoScore + ppScore + compScore) / 4);
                        return Math.min(100, base + (gameState.speedBonusTotal || 0) + speedBonus);
                    })();
                    const objReached = gameState.scenario?.check?.(ind) || false;
                    const isRec = saveHighscore(gameState.scenario?.id, finalScore, objReached);
                    const prevInd2 = gameState.history.length > 0 ? gameState.history[gameState.history.length-1].indicators : gameState.scenario?.initialState;
                    const stories2 = generateNarratives(ind, selectedData, prevInd2);
                    setGameState(prev => ({ ...prev, ...baseUpdate, indicators: ind, history: newHistory, phase: 'narrative', pendingPhase: 'results', narrativeStories: stories2, isNewRecord: isRec, speedBonusTotal: 0, completedScenarios: [...(prev.completedScenarios || []), prev.scenario?.id], pendingBonus: {} }));
                } else {
                    const prevInd3 = gameState.history.length > 0 ? gameState.history[gameState.history.length-1].indicators : gameState.scenario?.initialState;
                    const stories3 = generateNarratives(ind, selectedData, prevInd3);
                    setGameState(prev => ({ ...prev, ...baseUpdate, quarter: prev.quarter + 1, indicators: ind, history: newHistory, selectedDecisions: [], speedBonusTotal: (prev.speedBonusTotal || 0) + speedBonus, narrativeStories: stories3, pendingPhase: 'playing', phase: 'narrative', pendingBonus: newPendingBonus }));
                }
            };

            // Wrapper called by button click — captures timeLeft at moment of click
            const executeQuarterWithBonus = (overrideSeconds) => {
                const secs = overrideSeconds !== undefined ? overrideSeconds : timeLeft;
                const bonus = timerEnabled ? calcSpeedBonus(secs) : 0;
                setTimeLeft(TIMER_DURATION); // reset visually
                executeQuarter(bonus);
            };

            const continueAfterEvent = () => {
                const isMidterm = gameState.quarter === 4;
                const isLast = gameState.quarter >= gameState.totalQuarters;
                const ev = gameState.eventTriggered;
                const prevInd = gameState.history.length > 1 ? gameState.history[gameState.history.length-2].indicators : gameState.scenario?.initialState;
                const evStory = ev ? [{ tone: ev.positive ? 'positive' : 'negative', icon: ev.icon, text: ev.description, notion: 'Événement imprévu – Gestion de crise' }] : [];
                if (isMidterm) {
                    setGameState(prev => ({ ...prev, eventTriggered: null, narrativeStories: evStory, pendingPhase: 'midterm', phase: evStory.length ? 'narrative' : 'midterm' }));
                } else if (isLast) {
                    const ind2 = gameState.indicators;
                    const finalScore2 = (() => {
                        const f = ind2; const i2 = gameState.scenario?.initialState || {};
                        const caScore = Math.max(0, Math.min(100, (f.ca - (i2.ca||0)) * 3));
                        const tresoScore = Math.max(0, 100 - Math.abs(100 - f.tresorerie));
                        const ppScore = Math.max(0, 100 - Math.abs(f.clients - f.salaries));
                        const compScore = Math.max(0, (f.partMarche + f.competitivite) / 2);
                        return Math.round((caScore + tresoScore + ppScore + compScore) / 4);
                    })();
                    const objReached2 = gameState.scenario?.check?.(ind2) || false;
                    const isRec2 = saveHighscore(gameState.scenario?.id, finalScore2, objReached2);
                    setGameState(prev => ({ ...prev, eventTriggered: null, narrativeStories: evStory, pendingPhase: 'results', phase: evStory.length ? 'narrative' : 'results', isNewRecord: isRec2, completedScenarios: [...(prev.completedScenarios || []), prev.scenario?.id] }));
                } else {
                    setGameState(prev => ({ ...prev, quarter: prev.quarter + 1, selectedDecisions: [], eventTriggered: null, narrativeStories: evStory, pendingPhase: 'playing', phase: evStory.length ? 'narrative' : 'playing' }));
                }
            };

            const continueFromMidterm = () => {
                setGameState(prev => ({ ...prev, quarter: prev.quarter + 1, selectedDecisions: [], phase: 'playing' }));
            };

            const resetGame = () => {
                localStorage.removeItem('chef-entreprise-game');
                setGameState({ ...INITIAL_STATE, phase: 'scenario' });
            };

            const backToScenarios = () => {
                setGameState(prev => ({ ...INITIAL_STATE, completedScenarios: prev.completedScenarios || [], phase: 'scenario' }));
            };

            const setFilter = (f) => setGameState(prev => ({ ...prev, activeFilter: f }));

            /* ── CHART (SVG sparklines) ── */
            const renderChart = () => {
                const history = gameState.history;
                const sc = gameState.scenario;
                if (!sc || history.length === 0) return (
                    <div style={{padding:'40px',textAlign:'center',color:'#aaa'}}>
                        Aucune donnée encore — les graphiques apparaîtront après le premier trimestre.
                    </div>
                );

                const keys = Object.keys(INDICATOR_META);
                const quarters = [0, ...history.map(h => h.quarter)];
                const initialState = sc.initialState;

                // Build series data: initial + each history point
                const series = {};
                keys.forEach(k => {
                    series[k] = [initialState[k], ...history.map(h => h.indicators[k])];
                });

                const W = Math.max(500, quarters.length * 80);
                const H = 220;
                const PAD = { top: 20, right: 20, bottom: 30, left: 40 };
                const chartW = W - PAD.left - PAD.right;
                const chartH = H - PAD.top - PAD.bottom;

                const xScale = (i) => (i / (quarters.length - 1)) * chartW;
                const yScale = (v) => chartH - ((Math.min(Math.max(v, 0), 150) / 150) * chartH);

                const visibleKeys = keys.filter(k => !hiddenLines[k]);

                // Grid lines
                const gridLines = [0, 25, 50, 75, 100].map(v => ({
                    y: yScale(v), label: v
                }));

                return (
                    <div className="chart-wrap">
                        <div className="chart-title">📈 Évolution des indicateurs sur les trimestres</div>
                        <div className="chart-svg-wrap">
                            <svg width={W} height={H} style={{display:'block'}}>
                                <g transform={`translate(${PAD.left},${PAD.top})`}>
                                    {/* Grid */}
                                    {gridLines.map(({y, label}) => (
                                        <g key={label}>
                                            <line x1={0} y1={y} x2={chartW} y2={y} stroke="#f0f0f0" strokeWidth={1}/>
                                            <text x={-6} y={y+4} textAnchor="end" fontSize="10" fill="#aaa">{label}</text>
                                        </g>
                                    ))}

                                    {/* X axis labels */}
                                    {quarters.map((q, i) => (
                                        <text key={i} x={xScale(i)} y={chartH + 18} textAnchor="middle" fontSize="10" fill="#888">
                                            {i === 0 ? 'Départ' : `T${q}`}
                                        </text>
                                    ))}

                                    {/* Lines */}
                                    {keys.filter(k => !hiddenLines[k]).map(k => {
                                        const pts = series[k];
                                        const d = pts.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i)} ${yScale(v)}`).join(' ');
                                        return (
                                            <g key={k}>
                                                <path d={d} fill="none" stroke={CHART_COLORS[k]} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>
                                                {pts.map((v, i) => (
                                                    <circle key={i} cx={xScale(i)} cy={yScale(v)} r={4} fill={CHART_COLORS[k]}/>
                                                ))}
                                            </g>
                                        );
                                    })}

                                    {/* Objective line if applicable */}
                                    {sc.check && (() => {
                                        // Show a reference at 65 for most indicators
                                        const refY = yScale(65);
                                        return (
                                            <line x1={0} y1={refY} x2={chartW} y2={refY}
                                                stroke="#ffc107" strokeWidth={1} strokeDasharray="5,4" opacity={0.6}/>
                                        );
                                    })()}
                                </g>
                            </svg>
                        </div>
                        <div className="chart-legend">
                            {keys.map(k => (
                                <div key={k} className="legend-item"
                                     onClick={() => setHiddenLines(prev => ({...prev, [k]: !prev[k]}))}
                                     style={{opacity: hiddenLines[k] ? 0.35 : 1}}>
                                    <div className="legend-dot" style={{background: CHART_COLORS[k]}}/>
                                    <span>{INDICATOR_META[k].icon} {INDICATOR_META[k].label}</span>
                                </div>
                            ))}
                            <div style={{fontSize:'0.75em',color:'#aaa',marginLeft:'auto',alignSelf:'center'}}>Cliquez sur un indicateur pour le masquer</div>
                        </div>
                        <div style={{marginTop:'20px'}}>
                            <div className="chart-title" style={{marginBottom:'12px'}}>📊 Valeurs actuelles</div>
                            <div className="dashboard">
                                {Object.keys(INDICATOR_META).map(key => {
                                    const meta = INDICATOR_META[key];
                                    const val = gameState.indicators[key];
                                    const init = sc.initialState[key] || 0;
                                    const delta = Math.round(val - init);
                                    const trend = getTrend(key);
                                    return (
                                        <div key={key} className={`indicator ${indicatorClass(key, val)}`}>
                                            <div className="indicator-label">{meta.icon} {meta.label}</div>
                                            <div className="indicator-value">{Math.round(val)}<small style={{fontSize:'0.45em',color:'#999'}}>{meta.unit}</small></div>
                                            <span className={`indicator-trend ${trendClass(trend)}`}>{trendLabel(trend)}</span>
                                            <div style={{fontSize:'0.72em',color: delta >= 0 ? '#28a745' : '#dc3545',marginTop:'3px'}}>
                                                {delta >= 0 ? '▲' : '▼'} {delta >= 0 ? '+' : ''}{delta} vs départ
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            /* ── JOURNAL ── */
            const renderJournal = () => {
                const history = gameState.history;
                if (history.length === 0) return (
                    <div style={{padding:'40px',textAlign:'center',color:'#aaa'}}>
                        Le journal se remplira au fil des trimestres.
                    </div>
                );
                return (
                    <div className="journal-wrap">
                        <div className="chart-title">📜 Journal des actions – Tous les trimestres</div>
                        {[...history].reverse().map(h => {
                            const prevInd = gameState.scenario?.initialState;
                            // Compute deltas from previous quarter if possible
                            const prevH = history.find(x => x.quarter === h.quarter - 1);
                            const prevState = prevH ? prevH.indicators : gameState.scenario?.initialState;

                            return (
                                <div key={h.quarter} className="journal-entry">
                                    <div className="journal-header">
                                        <span className="journal-quarter-badge">T{h.quarter}</span>
                                        <span style={{fontWeight:600}}>Trimestre {h.quarter} – {h.quarter <= 4 ? 'Année 1' : 'Année 2'}</span>
                                        {h.event && (
                                            <span className={`journal-event-pill ms-auto ${h.event.positive ? 'journal-event-pos' : 'journal-event-neg'}`}
                                                  style={{marginLeft:'auto'}}>
                                                {h.event.icon} {h.event.name}
                                            </span>
                                        )}
                                    </div>
                                    <div className="journal-body">
                                        {/* Decisions */}
                                        {h.decisions.length > 0 ? (
                                            <div>
                                                <div style={{fontSize:'0.78em',color:'#888',fontWeight:600,marginBottom:'6px',textTransform:'uppercase',letterSpacing:'0.5px'}}>Décisions prises</div>
                                                <div className="journal-decisions">
                                                    {h.decisions.map(d => (
                                                        <span key={d.id} className="journal-dec-pill">
                                                            {d.icon} {d.name}
                                                            <span style={{opacity:0.6,fontSize:'0.85em'}}>({d.cost > 0 ? `−${d.cost}` : d.cost < 0 ? `+${Math.abs(d.cost)}` : 'Gratuit'})</span>
                                                        </span>
                                                    ))}
                                                </div>
                                                {/* Notions */}
                                                <div style={{display:'flex',flexWrap:'wrap',gap:'5px',marginTop:'6px'}}>
                                                    {h.decisions.map(d => (
                                                        <span key={d.id} style={{fontSize:'0.72em',background:'#f0f4f8',color:'#555',padding:'2px 8px',borderRadius:'10px'}}>
                                                            📚 {d.notion}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="journal-no-dec">Aucune décision prise ce trimestre.</div>
                                        )}

                                        {/* Event detail */}
                                        {h.event && (
                                            <div style={{marginTop:'10px',padding:'10px',background: h.event.positive ? '#f0fff4' : '#fff5f5',borderRadius:'8px',fontSize:'0.85em',color:'#555'}}>
                                                <strong>{h.event.positive ? '✅' : '⚠️'} {h.event.name}</strong> — {h.event.description}
                                            </div>
                                        )}

                                        {/* Indicator deltas */}
                                        {prevState && (
                                            <div style={{marginTop:'10px'}}>
                                                <div style={{fontSize:'0.78em',color:'#888',fontWeight:600,marginBottom:'5px',textTransform:'uppercase',letterSpacing:'0.5px'}}>Impact sur les indicateurs</div>
                                                <div className="journal-impacts">
                                                    {Object.keys(INDICATOR_META).map(k => {
                                                        const delta = Math.round(h.indicators[k] - prevState[k]);
                                                        if (delta === 0) return null;
                                                        const good = INDICATOR_META[k].higherBetter !== false;
                                                        const isPos = good ? delta > 0 : delta < 0;
                                                        return (
                                                            <span key={k} className="journal-delta"
                                                                  style={{background: isPos ? '#d4edda' : '#f8d7da', color: isPos ? '#155724' : '#721c24'}}>
                                                                {INDICATOR_META[k].icon} {INDICATOR_META[k].label} {delta > 0 ? '+' : ''}{delta}
                                                            </span>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}

                                        <div className="journal-revenue">
                                            💰 Recettes générées ce trimestre : +{h.revenue} · Trésorerie finale : {Math.round(h.indicators.tresorerie)}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                );
            };

            /* ── GLOSSAIRE ── */
            const renderGlossary = () => {
                const cats = [
                    {k:'all', l:'🗂️ Tout'},
                    {k:'management', l:'🏢 Management'},
                    {k:'grh', l:'👥 GRH'},
                    {k:'finance', l:'💰 Finance'},
                    {k:'marketing', l:'📣 Marketing'},
                    {k:'innovation', l:'🔬 Innovation'},
                    {k:'strategie', l:'🌍 Stratégie'},
                    {k:'droit', l:'⚖️ Éco-Droit'},
                ];
                const filtered = GLOSSARY.filter(g => {
                    const matchCat = glossaryCat === 'all' || g.cat === glossaryCat;
                    const q = glossarySearch.toLowerCase();
                    const matchSearch = !q || g.term.toLowerCase().includes(q) || g.def.toLowerCase().includes(q) || (g.lien && g.lien.toLowerCase().includes(q));
                    return matchCat && matchSearch;
                });
                const catColors = {
                    management: '#1e3c72', grh: '#27ae60', finance: '#2980b9',
                    marketing: '#e67e22', innovation: '#8e44ad', strategie: '#16a085', droit: '#c0392b'
                };
                return (
                    <div className="glossary-wrap">
                        <div className="chart-title">📚 Glossaire – Notions STMG Management & Économie-Droit</div>
                        <input
                            className="glossary-search"
                            placeholder="🔍 Rechercher une notion, un auteur, un sigle…"
                            value={glossarySearch}
                            onChange={e => setGlossarySearch(e.target.value)}
                        />
                        <div className="glossary-cats">
                            {cats.map(({k, l}) => (
                                <button key={k}
                                        className={`filter-btn${glossaryCat === k ? ' active' : ''}`}
                                        onClick={() => setGlossaryCat(k)}>{l}</button>
                            ))}
                        </div>
                        {filtered.length === 0 ? (
                            <div className="glossary-empty">Aucune notion trouvée pour "{glossarySearch}".</div>
                        ) : (
                            <div className="glossary-grid">
                                {filtered.map((g, i) => (
                                    <div key={i} className="glossary-card"
                                         style={{borderLeftColor: catColors[g.cat] || '#11998e'}}>
                                        <div className="glossary-term">{g.term}</div>
                                        <div className="glossary-cat-badge"
                                             style={{background: catColors[g.cat] + '22', color: catColors[g.cat] || '#333'}}>
                                            {g.catLabel}
                                        </div>
                                        <div className="glossary-def">{g.def}</div>
                                        {g.lien && <div className="glossary-link">→ Auteur·s / repère : {g.lien}</div>}
                                    </div>
                                ))}
                            </div>
                        )}
                        <div style={{marginTop:'20px',color:'#aaa',fontSize:'0.8em',textAlign:'center'}}>
                            {filtered.length} notion{filtered.length > 1 ? 's' : ''} affichée{filtered.length > 1 ? 's' : ''}
                        </div>
                    </div>
                );
            };

            /* ── Score ── */
            const calculateScore = () => {
                const f = gameState.indicators;
                const i = gameState.scenario?.initialState || {};
                const caScore = Math.max(0, Math.min(100, (f.ca - (i.ca || 0)) * 3));
                const tresoScore = Math.max(0, 100 - Math.abs(100 - f.tresorerie));
                const ppScore = Math.max(0, 100 - Math.abs(f.clients - f.salaries));
                const competScore = Math.max(0, (f.partMarche + f.competitivite) / 2);
                const total = (caScore + tresoScore + ppScore + competScore) / 4;
                return {
                    total: Math.round(total),
                    ca: Math.round(caScore),
                    tresorerie: Math.round(tresoScore),
                    partiesPrenantes: Math.round(ppScore),
                    competitivite: Math.round(competScore)
                };
            };

            const scoreClass = (s) => s >= 80 ? 'score-excellent' : s >= 60 ? 'score-good' : s >= 40 ? 'score-average' : 'score-poor';
            const scoreText = (s) => s >= 80 ? 'Excellent !' : s >= 60 ? 'Bien' : s >= 40 ? 'Passable' : 'Insuffisant';

            const indicatorClass = (key, val) => {
                const good = INDICATOR_META[key]?.higherBetter !== false;
                if (good) return val >= 65 ? 'indicator-good' : val >= 40 ? 'indicator-warning' : 'indicator-bad';
                return val <= 35 ? 'indicator-good' : val <= 60 ? 'indicator-warning' : 'indicator-bad';
            };

            const diagClass = (key, val) => {
                const good = INDICATOR_META[key]?.higherBetter !== false;
                if (good) return val >= 60 ? 'diag-good' : val >= 40 ? 'diag-warning' : 'diag-bad';
                return val <= 30 ? 'diag-good' : val <= 55 ? 'diag-warning' : 'diag-bad';
            };

            /* ── Budget Trend ── */
            const getTrend = (key) => {
                if (gameState.history.length < 2) return 'stable';
                const last = gameState.history[gameState.history.length - 1]?.indicators[key];
                const prev = gameState.history[gameState.history.length - 2]?.indicators[key];
                if (last === undefined || prev === undefined) return 'stable';
                const good = INDICATOR_META[key]?.higherBetter !== false;
                const delta = last - prev;
                if (delta > 0) return good ? 'up' : 'down';
                if (delta < 0) return good ? 'down' : 'up';
                return 'stable';
            };

            const trendLabel = (t) => t === 'up' ? '▲ Hausse' : t === 'down' ? '▼ Baisse' : '→ Stable';
            const trendClass = (t) => t === 'up' ? 'trend-up' : t === 'down' ? 'trend-down' : 'trend-stable';

            /* ── Conseils contextuels ── */
            const generateAdvice = () => {
                const ind = gameState.indicators;
                const q = gameState.quarter;
                const sc = gameState.scenario;
                const tips = [];

                if (ind.tresorerie < 25) tips.push({ icon: '🚨', text: 'Trésorerie critique ! Prenez un emprunt ou cédez des actifs avant d\'investir.', type: 'danger' });
                else if (ind.tresorerie < 45) tips.push({ icon: '⚠️', text: 'Trésorerie en tension. Limitez-vous à 1-2 décisions ce trimestre.', type: 'warning' });

                if (ind.salaries < 38) tips.push({ icon: '👥', text: 'Salariés démotivés. Sans action RH urgente, la productivité va chuter.', type: 'warning' });
                if (ind.innovation < 22 && q <= 5) tips.push({ icon: '🔬', text: 'Innovation trop basse. Risque de perte de compétitivité durable.', type: 'warning' });
                if (ind.endettement > 72) tips.push({ icon: '💳', text: 'Endettement dangereux. Pas de nouvel emprunt, privilégiez l\'autofinancement.', type: 'warning' });
                if (ind.clients < 30) tips.push({ icon: '😤', text: 'Satisfaction clients en chute. Renforcez le service client ou la fidélisation.', type: 'warning' });

                if (sc?.objectiveKeys) {
                    sc.objectiveKeys.forEach(k => {
                        const val = ind[k];
                        const meta = INDICATOR_META[k];
                        if (meta && val < 35) tips.push({ icon: '🎯', text: `"${meta.label}" (${Math.round(val)}) est très loin de l'objectif. Concentrez vos décisions dessus.`, type: 'danger' });
                    });
                }

                const cooldownCount = Object.keys(gameState.cooldowns || {}).filter(id => (gameState.cooldowns[id] || 0) > q).length;
                if (cooldownCount >= 5) tips.push({ icon: '🔄', text: 'Beaucoup de décisions en cooldown. Explorez d\'autres catégories pour varier la stratégie.', type: 'info' });

                if (Object.keys(gameState.pendingBonus || {}).length > 0) {
                    const bonusDesc = Object.entries(gameState.pendingBonus).map(([k, v]) => `${INDICATOR_META[k]?.icon || ''} ${v > 0 ? '+' : ''}${v}`).join(' ');
                    tips.push({ icon: '💫', text: `Effets différés actifs ce trimestre : ${bonusDesc}`, type: 'info' });
                }

                return tips.slice(0, 2);
            };

            /* ── Total cost of selected ── */
            const totalCost = gameState.selectedDecisions.reduce((acc, id) => {
                const d = DECISIONS.find(x => x.id === id);
                return acc + (d && d.cost > 0 ? d.cost : 0);
            }, 0);

            /* ── Filtered decisions ── */
            const filteredDecisions = DECISIONS.filter(d => {
                if (!gameState.activeFilter || gameState.activeFilter === 'all') return true;
                if (['strategique','tactique','operationnelle'].includes(gameState.activeFilter)) return d.decisionType === gameState.activeFilter;
                return d.category === gameState.activeFilter;
            });

            /* ───────────────────────────────── RENDER PHASES ───────────────────────────────── */

            /* SCÉNARIO */
            if (gameState.phase === 'scenario') {
                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 Chef d'Entreprise</h1>
                            <p>Stratégie &amp; Management – Serious Game STMG</p>
                        </div>
                        <div className="results-screen">
                            <h2 className="results-title">Choisissez votre entreprise</h2>
                            <p style={{fontSize:'1.05em',color:'#666',marginBottom:'35px'}}>
                                Chaque scénario vous place dans un contexte différent – analysez, décidez, pilotez !
                            </p>
                            <div className="scenario-grid">
                                {Object.values(SCENARIOS).map(sc => {
                                    const done = (gameState.completedScenarios || []).includes(sc.id);
                                    const scHs = highscores[sc.id];
                                    return (
                                        <div key={sc.id} className={`scenario-card${done?' completed':''}`}
                                             onClick={() => selectScenario(sc.id)}
                                             style={{borderColor: done ? '#28a745' : sc.color, borderTopWidth: 5}}>
                                            {done && <span className="completed-badge">✓ Complété</span>}
                                            <div className="scenario-name" style={{color: sc.color}}>{sc.name}</div>
                                            <span className={`scenario-difficulty ${sc.diffClass}`}>{sc.difficulty}</span>
                                            <div className="scenario-desc">{sc.description}</div>
                                            <div style={{fontSize:'0.82em',color:'#888',marginBottom:'6px'}}>Secteur : {sc.sector}</div>
                                            <div className="scenario-objective">🎯 {sc.objectives}</div>
                                            {scHs && (
                                                <div className="scenario-best">
                                                    <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
                                                        <span>🏆 Record : <strong>{scHs.best}/100</strong></span>
                                                        <div className="stars-row" style={{fontSize:'1em',margin:0}}>{[1,2,3].map(s=><span key={s} style={{color: s<=getStars(scHs.best)?'#f39c12':'#ddd'}}>★</span>)}</div>
                                                    </div>
                                                    <div style={{fontSize:'0.78em',color:'#aaa',marginTop:'2px'}}>{scHs.history?.length || 1} partie{(scHs.history?.length||1)>1?'s':''} jouée{(scHs.history?.length||1)>1?'s':''}</div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                            <div style={{marginTop:'30px',color:'#888',fontSize:'0.9em'}}>
                                💡 Jouez les 4 scénarios pour couvrir l'ensemble du programme Management STMG
                            </div>
                            <div className="action-buttons" style={{marginTop:'20px'}}>
                                <button className="btn btn-secondary" onClick={()=>{
                                    setGameState(prev=>({...prev, phase:'glossary_standalone'}));
                                }}>📚 Glossaire STMG</button>
                                <button className="btn" style={{background:'#1e3c72',color:'white'}} onClick={()=>{
                                    setGameState(prev=>({...prev, phase:'teacher'}));
                                }}>👩‍🏫 Tableau de bord Professeur</button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* START */
            if (gameState.phase === 'start') {
                const sc = gameState.scenario;
                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 Chef d'Entreprise</h1>
                            <p>{sc.name} – {sc.sector}</p>
                        </div>
                        <div className="start-screen">
                            <h2>Bienvenue, PDG !</h2>
                            <div className="context-card">
                                <h3>📋 Contexte de l'entreprise</h3>
                                <p>{sc.context}</p>
                                <h3 style={{marginTop:'18px'}}>🎯 Votre mission</h3>
                                <p><strong>{sc.objectiveLine}</strong></p>
                                <h3 style={{marginTop:'18px'}}>🎮 Comment jouer ?</h3>
                                <ul>
                                    <li>Vous dirigez l'entreprise sur <strong>8 trimestres (2 ans)</strong></li>
                                    <li>Chaque trimestre, choisissez <strong>jusqu'à 3 décisions</strong> stratégiques</li>
                                    <li>Chaque décision coûte de la <strong>trésorerie</strong> (votre budget)</li>
                                    <li>Des <strong>événements imprévus</strong> peuvent survenir chaque trimestre</li>
                                    <li>Un <strong>bilan de mi-parcours</strong> est réalisé après le 4ᵉ trimestre</li>
                                    <li>Identifiez le <strong>type de décision</strong> : Stratégique / Tactique / Opérationnelle</li>
                                </ul>
                            </div>
