            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(135deg, #1e3c72 0%, #11998e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .game-header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .game-header p { font-size: 1.1em; opacity: 0.9; }

        .dashboard {

            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            padding: 25px;
            background: #f8f9fa;
        }

        .indicator {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }
        .indicator:hover { transform: translateY(-3px); box-shadow: 0 8px 12px rgba(0,0,0,0.15); }
        .indicator-label { font-size: 0.78em; color: #666; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .indicator-value { font-size: 2em; font-weight: bold; margin-bottom: 4px; }
        .indicator-trend { font-size: 0.8em; padding: 3px 8px; border-radius: 20px; display: inline-block; }
        .trend-up { background: #d4edda; color: #155724; }
        .trend-down { background: #f8d7da; color: #721c24; }
        .trend-stable { background: #fff3cd; color: #856404; }
        .indicator-bad .indicator-value { color: #dc3545; }
        .indicator-warning .indicator-value { color: #ffc107; }
        .indicator-good .indicator-value { color: #28a745; }

        .game-phase { padding: 30px; }
        .phase-title {
            font-size: 1.8em;
            color: #1e3c72;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #11998e;
        }

        .decisions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 18px;
            margin-top: 20px;
        }

        .decision-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .decision-card:hover { border-color: #11998e; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(17,153,142,0.25); }
        .decision-card.selected { border-color: #11998e; background: linear-gradient(135deg, #11998e15, #38ef7d10); box-shadow: 0 6px 20px rgba(17,153,142,0.35); }
        .decision-card.disabled { opacity: 0.45; cursor: not-allowed; }

        .decision-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

        .tag { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 0.72em; font-weight: bold; text-transform: uppercase; letter-spacing: 0.4px; }
        .tag-rh { background: #27ae60; color: white; }
        .tag-finance { background: #2980b9; color: white; }
        .tag-commercial { background: #e67e22; color: white; }
        .tag-innovation { background: #8e44ad; color: white; }
        .tag-strategie { background: #16a085; color: white; }

        .tag-strategique { background: #e74c3c; color: white; }
        .tag-tactique { background: #f39c12; color: white; }
        .tag-operationnelle { background: #27ae60; color: white; }

        .tag-notion { background: #f0f0f0; color: #555; font-style: italic; }

        .decision-name { font-size: 1.1em; font-weight: bold; margin-bottom: 8px; color: #333; }
        .decision-description { font-size: 0.88em; color: #666; margin-bottom: 12px; line-height: 1.5; }

        .decision-impacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .impact-badge { padding: 3px 8px; border-radius: 10px; font-size: 0.72em; font-weight: 600; }
        .impact-positive { background: #d4edda; color: #155724; }
        .impact-negative { background: #f8d7da; color: #721c24; }

        .decision-cost {
            position: absolute;
            top: 10px; right: 10px;
            background: #1e3c72;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: bold;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #dee2e6;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.2s;
        }
        .filter-btn:hover { border-color: #11998e; }
        .filter-btn.active { background: #11998e; color: white; border-color: #11998e; }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 36px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover:not(:disabled) { background: #5a6268; }
        .btn-danger { background: #dc3545; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .score-good { color: #17a2b8; }
        .score-average { color: #ffc107; }
        .score-poor { color: #dc3545; }

        .diag-warning { background: #fff3cd; color: #856404; }
        .diag-bad { background: #f8d7da; color: #721c24; }

        .budget-bar-container { width: 150px; }
        .budget-bar-label { font-size: 0.78em; margin-bottom: 4px; opacity: 0.9; }

        .budget-high { background: #38ef7d; }
        .budget-medium { background: #ffc107; }
        .budget-low { background: #e74c3c; }

        .midterm-screen { padding: 35px; }

        .midterm-rec { padding: 10px; background: white; border-radius: 8px; border-left: 3px solid #11998e; margin: 8px 0; font-size: 0.88em; color: #444; line-height: 1.5; }
        .midterm-rec.warning { border-left-color: #e74c3c; }

        .start-screen { padding: 40px; text-align: center; }
        .start-screen h2 { font-size: 2em; color: #1e3c72; margin-bottom: 20px; }
        .context-card { background: #f0f9ff; border: 2px solid #11998e; border-radius: 16px; padding: 30px; max-width: 800px; margin: 0 auto 30px; text-align: left; }
        .context-card h3 { color: #1e3c72; margin-bottom: 15px; font-size: 1.3em; }
        .context-card p { color: #555; line-height: 1.7; margin-bottom: 12px; }

        .progress-bar-container { margin: 20px 0; }
        .progress-bar { height: 8px; background: #dee2e6; border-radius: 4px; overflow: hidden; margin-top: 8px; }

            .decisions-grid { grid-template-columns: 1fr; }
            .btn { padding: 12px 24px; font-size: 0.9em; }
        }

        /* ===================== COMPOSANT PRINCIPAL ===================== */
        function Game() {
            const [gameState, setGameState] = useState(() => {
                try {
                    const saved = localStorage.getItem('chef-entreprise-game');
                    return saved ? JSON.parse(saved) : INITIAL_STATE;
                } catch(e) { return INITIAL_STATE; }
            });

            useEffect(() => {
                localStorage.setItem('chef-entreprise-game', JSON.stringify(gameState));
            }, [gameState]);

            /* ── Fonctions ── */
            const selectScenario = (id) => {
                const sc = SCENARIOS[id];
                setGameState({
                    ...INITIAL_STATE,
                    scenario: sc,
                    indicators: { ...sc.initialState },
                    phase: 'start',
                    completedScenarios: gameState.completedScenarios || []
                });
            };

            const startGame = () => setGameState(prev => ({ ...prev, phase: 'diagnostic' }));
            const startPlaying = () => setGameState(prev => ({ ...prev, quarter: 1, phase: 'playing' }));

            const toggleDecision = (id) => {
                setGameState(prev => {
                    const dec = DECISIONS.find(d => d.id === id);
                    if (!dec) return prev;
                    const cost = dec.cost > 0 ? dec.cost : 0;
                    const selected = prev.selectedDecisions.includes(id)
                        ? prev.selectedDecisions.filter(x => x !== id)
                        : prev.selectedDecisions.length < 3 && prev.indicators.tresorerie >= cost
                            ? [...prev.selectedDecisions, id]
                            : prev.selectedDecisions;
                    return { ...prev, selectedDecisions: selected };
                });
            };

            const executeQuarter = () => {
                const selectedData = DECISIONS.filter(d => gameState.selectedDecisions.includes(d.id));
                let ind = { ...gameState.indicators };

                // Apply decision impacts
                selectedData.forEach(dec => {
                    Object.keys(dec.impacts).forEach(key => {
                        if (ind[key] !== undefined) {
                            ind[key] = key === 'tresorerie'
                                ? Math.max(0, Math.min(150, ind[key] + dec.impacts[key]))
                                : Math.max(0, Math.min(100, ind[key] + dec.impacts[key]));
                        }
                    });
                    // Deduct cost from tresorerie
                    if (dec.cost > 0) ind.tresorerie = Math.max(0, ind.tresorerie - dec.cost);
                });

                // Quarterly cash regeneration (based on CA and market share)
                const baseRenewal = 20;
                const caBonus = Math.max(0, (ind.ca - 50)) * 0.3;
                const pmBonus = Math.max(0, (ind.partMarche - 15)) * 0.2;
                const totalRenewal = Math.round(baseRenewal + caBonus + pmBonus);
                ind.tresorerie = Math.min(150, ind.tresorerie + totalRenewal);

                // Random event
                const evtProb = gameState.scenario?.eventProbability || 0.5;
                const shouldEvent = Math.random() < evtProb && gameState.quarter < gameState.totalQuarters;
                const scenEvents = EVENTS.filter(e => !e.scenarios || e.scenarios.includes(gameState.scenario?.id));
                const randomEvent = shouldEvent && scenEvents.length > 0
                    ? scenEvents[Math.floor(Math.random() * scenEvents.length)]
                    : null;

                if (randomEvent) {
                    Object.keys(randomEvent.impacts).forEach(key => {
                        if (ind[key] !== undefined) {
                            ind[key] = key === 'tresorerie'
                                ? Math.max(0, Math.min(150, ind[key] + randomEvent.impacts[key]))
                                : Math.max(0, Math.min(100, ind[key] + randomEvent.impacts[key]));
                        }
                    });
                }

                const newHistory = [...gameState.history, {
                    quarter: gameState.quarter,
                    decisions: selectedData,
                    indicators: ind,
                    event: randomEvent,
                    revenue: totalRenewal
                }];

                const isMidterm = gameState.quarter === 4;
                const isLast = gameState.quarter >= gameState.totalQuarters;

                if (randomEvent) {
                    setGameState(prev => ({ ...prev, indicators: ind, history: newHistory, eventTriggered: randomEvent, phase: 'event' }));
                } else if (isMidterm) {
                    setGameState(prev => ({ ...prev, indicators: ind, history: newHistory, phase: 'midterm' }));
                } else if (isLast) {
                    setGameState(prev => ({ ...prev, indicators: ind, history: newHistory, phase: 'results', completedScenarios: [...(prev.completedScenarios || []), prev.scenario?.id] }));
                } else {
                    setGameState(prev => ({ ...prev, quarter: prev.quarter + 1, indicators: ind, history: newHistory, selectedDecisions: [], phase: 'playing' }));
                }
            };

            const continueAfterEvent = () => {
                const isMidterm = gameState.quarter === 4;
                const isLast = gameState.quarter >= gameState.totalQuarters;
                if (isMidterm) {
                    setGameState(prev => ({ ...prev, eventTriggered: null, phase: 'midterm' }));
                } else if (isLast) {
                    setGameState(prev => ({ ...prev, eventTriggered: null, phase: 'results', completedScenarios: [...(prev.completedScenarios || []), prev.scenario?.id] }));
                } else {
                    setGameState(prev => ({ ...prev, quarter: prev.quarter + 1, selectedDecisions: [], eventTriggered: null, phase: 'playing' }));
                }
            };

            const continueFromMidterm = () => {
                setGameState(prev => ({ ...prev, quarter: prev.quarter + 1, selectedDecisions: [], phase: 'playing' }));
            };

            const resetGame = () => {
                localStorage.removeItem('chef-entreprise-game');
                setGameState({ ...INITIAL_STATE, phase: 'scenario' });
            };

            const backToScenarios = () => {
                setGameState(prev => ({ ...INITIAL_STATE, completedScenarios: prev.completedScenarios || [], phase: 'scenario' }));
            };

            const setFilter = (f) => setGameState(prev => ({ ...prev, activeFilter: f }));

            /* ── Score ── */
            const calculateScore = () => {
                const f = gameState.indicators;
                const i = gameState.scenario?.initialState || {};
                const caScore = Math.max(0, Math.min(100, (f.ca - (i.ca || 0)) * 3));
                const tresoScore = Math.max(0, 100 - Math.abs(100 - f.tresorerie));
                const ppScore = Math.max(0, 100 - Math.abs(f.clients - f.salaries));
                const competScore = Math.max(0, (f.partMarche + f.competitivite) / 2);
                const total = (caScore + tresoScore + ppScore + competScore) / 4;
                return {
                    total: Math.round(total),
                    ca: Math.round(caScore),
                    tresorerie: Math.round(tresoScore),
                    partiesPrenantes: Math.round(ppScore),
                    competitivite: Math.round(competScore)
                };
            };

            const scoreClass = (s) => s >= 80 ? 'score-excellent' : s >= 60 ? 'score-good' : s >= 40 ? 'score-average' : 'score-poor';
            const scoreText = (s) => s >= 80 ? 'Excellent !' : s >= 60 ? 'Bien' : s >= 40 ? 'Passable' : 'Insuffisant';

            const indicatorClass = (key, val) => {
                const good = INDICATOR_META[key]?.higherBetter !== false;
                if (good) return val >= 65 ? 'indicator-good' : val >= 40 ? 'indicator-warning' : 'indicator-bad';
                return val <= 35 ? 'indicator-good' : val <= 60 ? 'indicator-warning' : 'indicator-bad';
            };

            const diagClass = (key, val) => {
                const good = INDICATOR_META[key]?.higherBetter !== false;
                if (good) return val >= 60 ? 'diag-good' : val >= 40 ? 'diag-warning' : 'diag-bad';
                return val <= 30 ? 'diag-good' : val <= 55 ? 'diag-warning' : 'diag-bad';
            };

            /* ── Budget Trend ── */
            const getTrend = (key) => {
                if (gameState.history.length < 2) return 'stable';
                const last = gameState.history[gameState.history.length - 1]?.indicators[key];
                const prev = gameState.history[gameState.history.length - 2]?.indicators[key];
                if (last === undefined || prev === undefined) return 'stable';
                const good = INDICATOR_META[key]?.higherBetter !== false;
                const delta = last - prev;
                if (delta > 0) return good ? 'up' : 'down';
                if (delta < 0) return good ? 'down' : 'up';
                return 'stable';
            };

            const trendLabel = (t) => t === 'up' ? '▲ Hausse' : t === 'down' ? '▼ Baisse' : '→ Stable';
            const trendClass = (t) => t === 'up' ? 'trend-up' : t === 'down' ? 'trend-down' : 'trend-stable';

            /* ── Total cost of selected ── */
            const totalCost = gameState.selectedDecisions.reduce((acc, id) => {
                const d = DECISIONS.find(x => x.id === id);
                return acc + (d && d.cost > 0 ? d.cost : 0);
            }, 0);

            /* ── Filtered decisions ── */
            const filteredDecisions = DECISIONS.filter(d => {
                if (!gameState.activeFilter || gameState.activeFilter === 'all') return true;
                if (['strategique','tactique','operationnelle'].includes(gameState.activeFilter)) return d.decisionType === gameState.activeFilter;
                return d.category === gameState.activeFilter;
            });

            /* ───────────────────────────────── RENDER PHASES ───────────────────────────────── */

            /* SCÉNARIO */
            if (gameState.phase === 'scenario') {
                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 Chef d'Entreprise</h1>
                            <p>Stratégie &amp; Management – Serious Game STMG</p>
                        </div>
                        <div className="results-screen">
                            <h2 className="results-title">Choisissez votre entreprise</h2>
                            <p style={{fontSize:'1.05em',color:'#666',marginBottom:'35px'}}>
                                Chaque scénario vous place dans un contexte différent – analysez, décidez, pilotez !
                            </p>
                            <div className="scenario-grid">
                                {Object.values(SCENARIOS).map(sc => {
                                    const done = (gameState.completedScenarios || []).includes(sc.id);
                                    return (
                                        <div key={sc.id} className={`scenario-card${done?' completed':''}`}
                                             onClick={() => selectScenario(sc.id)}
                                             style={{borderColor: done ? '#28a745' : sc.color, borderTopWidth: 5}}>
                                            {done && <span className="completed-badge">✓ Complété</span>}
                                            <div className="scenario-name" style={{color: sc.color}}>{sc.name}</div>
                                            <span className={`scenario-difficulty ${sc.diffClass}`}>{sc.difficulty}</span>
                                            <div className="scenario-desc">{sc.description}</div>
                                            <div style={{fontSize:'0.82em',color:'#888',marginBottom:'6px'}}>Secteur : {sc.sector}</div>
                                            <div className="scenario-objective">🎯 {sc.objectives}</div>
                                        </div>
                                    );
                                })}
                            </div>
                            <div style={{marginTop:'30px',color:'#888',fontSize:'0.9em'}}>
                                💡 Jouez les 4 scénarios pour couvrir l'ensemble du programme Management STMG
                            </div>
                        </div>
                    </div>
                );
            }

            /* START */
            if (gameState.phase === 'start') {
                const sc = gameState.scenario;
                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 Chef d'Entreprise</h1>
                            <p>{sc.name} – {sc.sector}</p>
                        </div>
                        <div className="start-screen">
                            <h2>Bienvenue, PDG !</h2>
                            <div className="context-card">
                                <h3>📋 Contexte de l'entreprise</h3>
                                <p>{sc.context}</p>
                                <h3 style={{marginTop:'18px'}}>🎯 Votre mission</h3>
                                <p><strong>{sc.objectiveLine}</strong></p>
                                <h3 style={{marginTop:'18px'}}>🎮 Comment jouer ?</h3>
                                <ul>
                                    <li>Vous dirigez l'entreprise sur <strong>8 trimestres (2 ans)</strong></li>
                                    <li>Chaque trimestre, choisissez <strong>jusqu'à 3 décisions</strong> stratégiques</li>
                                    <li>Chaque décision coûte de la <strong>trésorerie</strong> (votre budget)</li>
                                    <li>Des <strong>événements imprévus</strong> peuvent survenir chaque trimestre</li>
                                    <li>Un <strong>bilan de mi-parcours</strong> est réalisé après le 4ᵉ trimestre</li>
                                    <li>Identifiez le <strong>type de décision</strong> : Stratégique / Tactique / Opérationnelle</li>
                                </ul>
                            </div>
                            <div className="action-buttons">
                                <button className="btn btn-secondary" onClick={backToScenarios}>← Changer d'entreprise</button>
                                <button className="btn btn-primary" onClick={startGame}>Analyser la situation →</button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* DIAGNOSTIC */
            if (gameState.phase === 'diagnostic') {
                const ind = gameState.indicators;
                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 {gameState.scenario?.name}</h1>
                            <p>Diagnostic initial de l'entreprise</p>
                        </div>
                        <div className="diagnostic-screen">
                            <h2 className="phase-title">📊 Diagnostic stratégique</h2>
                            <p style={{color:'#666',marginBottom:'20px',fontSize:'0.95em'}}>
                                Analysez la situation de votre entreprise avant de prendre vos premières décisions. Identifiez les forces, faiblesses, opportunités et menaces (SWOT).
                            </p>
                            <div className="diag-grid">
                                <div className="diag-card">
                                    <h4>💰 Situation financière</h4>
                                    {[['ca','CA (croissance)'],['tresorerie','Trésorerie'],['endettement','Endettement']].map(([k,l]) => (
                                        <div key={k} className="diag-item">
                                            <span>{l}</span>
                                            <span className={`diag-value ${diagClass(k, ind[k])}`}>{Math.round(ind[k])}{INDICATOR_META[k].unit}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="diag-card">
                                    <h4>🎯 Position commerciale</h4>
                                    {[['partMarche','Part de marché'],['clients','Satisfaction clients'],['image','Image de marque']].map(([k,l]) => (
                                        <div key={k} className="diag-item">
                                            <span>{l}</span>
                                            <span className={`diag-value ${diagClass(k, ind[k])}`}>{Math.round(ind[k])}{INDICATOR_META[k].unit}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="diag-card">
                                    <h4>👥 Capital humain</h4>
                                    {[['salaries','Satisfaction salariés'],['productivite','Productivité']].map(([k,l]) => (
                                        <div key={k} className="diag-item">
                                            <span>{l}</span>
                                            <span className={`diag-value ${diagClass(k, ind[k])}`}>{Math.round(ind[k])}{INDICATOR_META[k].unit}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="diag-card">
                                    <h4>🏆 Position stratégique</h4>
                                    {[['innovation','Innovation'],['competitivite','Compétitivité']].map(([k,l]) => (
                                        <div key={k} className="diag-item">
                                            <span>{l}</span>
                                            <span className={`diag-value ${diagClass(k, ind[k])}`}>{Math.round(ind[k])}{INDICATOR_META[k].unit}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div style={{background:'#fff3cd',border:'2px solid #ffc107',borderRadius:'12px',padding:'20px',maxWidth:'700px',margin:'10px auto'}}>
                                <strong>🎯 Rappel de l'objectif :</strong> {gameState.scenario?.objectiveLine}
                            </div>
                            <div className="action-buttons">
                                <button className="btn btn-primary" onClick={startPlaying}>Commencer – Trimestre 1 →</button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* PLAYING */
            if (gameState.phase === 'playing') {
                const ind = gameState.indicators;
                const tresoPercent = Math.min(100, (ind.tresorerie / 150) * 100);
                const tresoClass = tresoPercent > 55 ? 'budget-high' : tresoPercent > 30 ? 'budget-medium' : 'budget-low';

                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 {gameState.scenario?.name}</h1>
                            <p>Dirigez votre entreprise vers le succès</p>
                        </div>

                        {/* Barre de progression */}
                        <div className="quarter-info">
                            <span>📅 Trimestre {gameState.quarter} / {gameState.totalQuarters}</span>
                            <span>🎯 {gameState.scenario?.objectives}</span>
                            <div className="budget-bar-container">
                                <div className="budget-bar-label">💰 Trésorerie : {Math.round(ind.tresorerie)}</div>
                                <div className="budget-bar">
                                    <div className={`budget-bar-fill ${tresoClass}`} style={{width:`${tresoPercent}%`}}></div>
                                </div>
                            </div>
                        </div>

                        {/* Tableau de bord */}
                        <div className="dashboard">
                            {Object.keys(INDICATOR_META).map(key => {
                                const meta = INDICATOR_META[key];
                                const val = ind[key];
                                const trend = getTrend(key);
                                return (
                                    <div key={key} className={`indicator ${indicatorClass(key, val)}`}>
                                        <div className="indicator-label">{meta.icon} {meta.label}</div>
                                        <div className="indicator-value">{Math.round(val)}<small style={{fontSize:'0.45em',color:'#999'}}>{meta.unit}</small></div>
                                        <span className={`indicator-trend ${trendClass(trend)}`}>{trendLabel(trend)}</span>
                                    </div>
                                );
                            })}
                        </div>

                        <div className="game-phase">
                            <h3 className="phase-title">⚡ Décisions – Trimestre {gameState.quarter}</h3>

                            <div className="selection-info">
                                {gameState.selectedDecisions.length}/3 décisions sélectionnées · Coût total : {totalCost} · Trésorerie après : ~{Math.round(ind.tresorerie - totalCost)}
                            </div>

                            {/* Filtres */}
                            <div className="filter-bar">
                                <span style={{fontWeight:'600',color:'#555',alignSelf:'center',marginRight:'4px'}}>Filtrer :</span>
                                {[
                                    {k:'all',l:'🗂️ Tout'},
                                    {k:'rh',l:'👥 RH'},
                                    {k:'finance',l:'💰 Finance'},
                                    {k:'commercial',l:'📣 Commercial'},
                                    {k:'innovation',l:'🔬 Innovation'},
                                    {k:'strategie',l:'🌍 Stratégie'},
                                    {k:'strategique',l:'Stratégique'},
                                    {k:'tactique',l:'Tactique'},
                                    {k:'operationnelle',l:'Opérationnelle'},
                                ].map(({k,l}) => (
                                    <button key={k} className={`filter-btn${gameState.activeFilter===k?' active':''}`} onClick={()=>setFilter(k)}>{l}</button>
                                ))}
                            </div>

                            <div className="decisions-grid">
                                {filteredDecisions.map(dec => {
                                    const isSelected = gameState.selectedDecisions.includes(dec.id);
                                    const realCost = dec.cost > 0 ? dec.cost : 0;
                                    const cantAfford = !isSelected && realCost > 0 && ind.tresorerie < realCost;
                                    const maxReached = !isSelected && gameState.selectedDecisions.length >= 3;
                                    const isDisabled = cantAfford || maxReached;
                                    const catMeta = CATEGORY_META[dec.category];
                                    const dtMeta = DT_META[dec.decisionType];

                                    return (
                                        <div key={dec.id}
                                             className={`decision-card${isSelected?' selected':''}${isDisabled?' disabled':''}`}
                                             onClick={() => !isDisabled && toggleDecision(dec.id)}>
                                            <div className="decision-cost">
                                                {dec.cost > 0 ? `−${dec.cost}` : dec.cost === 0 ? 'Gratuit' : `+${Math.abs(dec.cost)} 💰`}
                                            </div>
                                            <div className="decision-tags">
                                                <span className={`tag ${catMeta.tagClass}`}>{catMeta.label}</span>
                                                <span className={`tag ${dtMeta.tagClass}`}>{dtMeta.label}</span>
                                                <span className="tag tag-notion">📚 {dec.notion}</span>
                                            </div>
                                            <div className="decision-name">{dec.icon} {dec.name}</div>
                                            <div className="decision-description">{dec.description}</div>
                                            <div className="decision-impacts">
                                                {Object.entries(dec.impacts).map(([k, v]) => {
                                                    const good = INDICATOR_META[k]?.higherBetter !== false;
                                                    const isPos = good ? v > 0 : v < 0;
                                                    const sign = v > 0 ? '+' : '';
                                                    return (
                                                        <span key={k} className={`impact-badge ${isPos?'impact-positive':'impact-negative'}`}>
                                                            {impactLabels[k]} {sign}{v}
                                                        </span>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="action-buttons">
                                <button className="btn btn-secondary" onClick={backToScenarios}>← Menu</button>
                                <button className="btn btn-primary" onClick={executeQuarter}>
                                    Valider le trimestre {gameState.quarter} →
                                </button>
                            </div>

                            {/* Historique */}
                            {gameState.history.length > 0 && (
                                <div style={{marginTop:'30px'}}>
                                    <h4 style={{color:'#1e3c72',marginBottom:'12px'}}>📜 Historique des décisions</h4>
                                    <div className="history-timeline">
                                        {[...gameState.history].reverse().map(h => (
                                            <div key={h.quarter} className="history-item">
                                                <span className="history-quarter">T{h.quarter}</span>
                                                <div>
                                                    {h.decisions.map(d => <span key={d.id} style={{marginRight:'8px',fontWeight:'600'}}>{d.icon} {d.name}</span>)}
                                                    {h.event && <span style={{color:'#e74c3c',marginLeft:'6px'}}>⚡ {h.event.name}</span>}
                                                    <div style={{color:'#888',marginTop:'3px'}}>Recettes du trimestre : +{h.revenue}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            /* ÉVÉNEMENT */
            if (gameState.phase === 'event') {
                const ev = gameState.eventTriggered;
                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 {gameState.scenario?.name}</h1>
                            <p>Trimestre {gameState.quarter} – Événement imprévu</p>
                        </div>
                        <div className="event-modal" style={{position:'relative',background:'none',padding:'40px'}}>
                            <div className="event-content" style={{maxWidth:'680px',margin:'0 auto'}}>
                                <div className="event-icon">{ev?.icon}</div>
                                <div className="event-title">{ev?.name}</div>
                                <div className="event-description">{ev?.description}</div>
                                <div className="event-impacts-list">
                                    {ev && Object.entries(ev.impacts).map(([k, v]) => {
                                        const good = INDICATOR_META[k]?.higherBetter !== false;
                                        const isPos = good ? v > 0 : v < 0;
                                        const sign = v > 0 ? '+' : '';
                                        return (
                                            <span key={k} className={`impact-badge ${isPos?'impact-positive':'impact-negative'}`} style={{padding:'6px 14px',fontSize:'0.9em'}}>
                                                {impactLabels[k]} {sign}{v}
                                            </span>
                                        );
                                    })}
                                </div>
                                <p style={{color:'#888',fontSize:'0.88em',marginBottom:'20px'}}>
                                    💡 Comment votre stratégie peut-elle limiter ce risque ou exploiter cette opportunité ?
                                </p>
                                <button className="btn btn-primary" onClick={continueAfterEvent}>Continuer →</button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* MI-PARCOURS */
            if (gameState.phase === 'midterm') {
                const ind = gameState.indicators;
                const sc = gameState.scenario;
                const goalMet = sc?.check?.(ind);
                const midRecs = [];
                if (ind.tresorerie < 40) midRecs.push({ text: '⚠️ Trésorerie critique ! Envisagez un plan de réduction des coûts ou un emprunt.', warn: true });
                if (ind.salaries < 45) midRecs.push({ text: '⚠️ Vos salariés sont démotivés. Investissez en GRH (revalorisation, conditions de travail).', warn: true });
                if (ind.innovation < 30) midRecs.push({ text: '⚠️ Votre niveau d\'innovation est très bas. Risque de perte de compétitivité.', warn: true });
                if (ind.partMarche < 12) midRecs.push({ text: '⚠️ Votre part de marché est faible. Relancez votre stratégie commerciale.', warn: true });
                if (ind.endettement > 70) midRecs.push({ text: '⚠️ Endettement élevé. Évitez de nouveaux emprunts, privilégiez l\'autofinancement.', warn: true });
                if (ind.ca > 60) midRecs.push({ text: '✅ Bonne croissance du CA ! Maintenez votre dynamique commerciale.', warn: false });
                if (ind.salaries > 65) midRecs.push({ text: '✅ Vos équipes sont motivées. Le capital humain est un actif précieux.', warn: false });
                if (ind.innovation > 60) midRecs.push({ text: '✅ Votre niveau d\'innovation vous positionne favorablement pour la 2ᵉ année.', warn: false });
                if (midRecs.length === 0) midRecs.push({ text: '→ Situation équilibrée. Restez vigilant sur vos indicateurs les plus fragiles.', warn: false });

                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 Bilan de Mi-Parcours</h1>
                            <p>Fin de la 1ʳᵉ année – Analyse stratégique</p>
                        </div>
                        <div className="midterm-screen">
                            <h2 className="phase-title">📊 Rapport annuel – Fin d'année 1</h2>

                            <div style={{background: goalMet ? '#d4edda' : '#fff3cd', border:`2px solid ${goalMet?'#28a745':'#ffc107'}`, borderRadius:'12px', padding:'18px', marginBottom:'25px', fontSize:'1em'}}>
                                <strong>{goalMet ? '🟢 Vous êtes sur la bonne trajectoire !' : '🟡 Vous n\'avez pas encore atteint l\'objectif.'}</strong>
                                <br/><span style={{color:'#555'}}>{sc?.objectiveLine}</span>
                            </div>

                            <div className="midterm-grid">
                                <div className="midterm-card">
                                    <h4>📈 Indicateurs clés actuels</h4>
                                    {Object.entries(ind).map(([k, v]) => (
                                        <div key={k} className="diag-item">
                                            <span style={{fontSize:'0.88em'}}>{INDICATOR_META[k]?.icon} {INDICATOR_META[k]?.label}</span>
                                            <span className={`diag-value ${diagClass(k, v)}`}>{Math.round(v)}{INDICATOR_META[k]?.unit}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="midterm-card">
                                    <h4>💡 Recommandations pour l'année 2</h4>
                                    {midRecs.map((r, i) => (
                                        <div key={i} className={`midterm-rec${r.warn?' warning':''}`}>{r.text}</div>
                                    ))}
                                </div>
                                <div className="midterm-card">
                                    <h4>📜 Décisions prises (1ʳᵉ année)</h4>
                                    {gameState.history.slice(0,4).map(h => (
                                        <div key={h.quarter} style={{marginBottom:'8px',fontSize:'0.88em'}}>
                                            <strong style={{color:'#1e3c72'}}>T{h.quarter}</strong> :&nbsp;
                                            {h.decisions.length > 0 ? h.decisions.map(d => d.name).join(', ') : 'Aucune décision'}
                                            {h.event && <span style={{color:'#e74c3c'}}> · ⚡ {h.event.name}</span>}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="action-buttons">
                                <button className="btn btn-primary" onClick={continueFromMidterm}>Commencer l'année 2 →</button>
                            </div>
                        </div>
                    </div>
                );
            }

            /* RÉSULTATS */
            if (gameState.phase === 'results') {
                const score = calculateScore();
                const ind = gameState.indicators;
                const sc = gameState.scenario;
                const objectiveReached = sc?.check?.(ind);

                return (
                    <div className="game-container">
                        <div className="game-header">
                            <h1>🏢 Bilan Final</h1>
                            <p>{sc?.name} – Résultats après 2 ans</p>
                        </div>
                        <div className="results-screen">
                            <h2 className="results-title">
                                {objectiveReached ? '🎉 Objectif atteint !' : '📋 Fin de mandat'}
                            </h2>

                            <div style={{background: objectiveReached?'#d4edda':'#f8d7da', border:`2px solid ${objectiveReached?'#28a745':'#dc3545'}`, borderRadius:'12px', padding:'18px', maxWidth:'600px', margin:'0 auto 30px', fontSize:'1.05em'}}>
                                {objectiveReached
                                    ? <><strong>✅ Bravo !</strong> Vous avez rempli votre mission : {sc?.objectiveLine}</>
                                    : <><strong>❌ Objectif non atteint.</strong> {sc?.objectiveLine}<br/><span style={{fontSize:'0.9em',color:'#666',marginTop:'6px',display:'block'}}>Analysez vos choix et retentez le scénario avec une stratégie différente.</span></>
                                }
                            </div>

                            <div className="results-grid">
                                {[
                                    {key:'ca',label:'Performance CA',desc:'Croissance du chiffre d\'affaires', icon:'📈'},
                                    {key:'tresorerie',label:'Santé financière',desc:'Équilibre de la trésorerie', icon:'💰'},
                                    {key:'partiesPrenantes',label:'Parties prenantes',desc:'Équilibre clients / salariés', icon:'🤝'},
                                    {key:'competitivite',label:'Position stratégique',desc:'Part de marché + compétitivité', icon:'🏆'},
                                ].map(({key, label, desc, icon}) => {
                                    const s = score[key];
                                    return (
                                        <div key={key} className="result-card">
                                            <div style={{fontSize:'2em'}}>{icon}</div>
                                            <div style={{fontWeight:'bold',color:'#555',marginBottom:'5px'}}>{label}</div>
                                            <div className={`result-score ${scoreClass(s)}`}>{s}/100</div>
                                            <div style={{color:'#888',fontSize:'0.85em'}}>{scoreText(s)}</div>
                                            <div style={{color:'#aaa',fontSize:'0.78em',marginTop:'4px'}}>{desc}</div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className={`result-card ${scoreClass(score.total)}`} style={{maxWidth:'400px',margin:'0 auto 30px',padding:'30px',borderRadius:'16px',boxShadow:'0 8px 20px rgba(0,0,0,0.1)'}}>
                                <div style={{fontSize:'1.1em',fontWeight:'bold',color:'#333',marginBottom:'10px'}}>Score global</div>
                                <div style={{fontSize:'4em',fontWeight:'900'}} className={scoreClass(score.total)}>{score.total}/100</div>
                                <div style={{fontSize:'1.2em',marginTop:'8px'}} className={scoreClass(score.total)}>{scoreText(score.total)}</div>
                            </div>

                            {/* Tableau de bord final */}
                            <div style={{marginBottom:'30px'}}>
                                <h3 style={{color:'#1e3c72',marginBottom:'15px'}}>📊 Indicateurs finaux</h3>
                                <div className="dashboard">
                                    {Object.keys(INDICATOR_META).map(key => {
                                        const meta = INDICATOR_META[key];
                                        const val = ind[key];
                                        const init = sc?.initialState[key] || 0;
                                        const delta = Math.round(val - init);
                                        return (
                                            <div key={key} className={`indicator ${indicatorClass(key, val)}`}>
                                                <div className="indicator-label">{meta.icon} {meta.label}</div>
                                                <div className="indicator-value">{Math.round(val)}<small style={{fontSize:'0.45em',color:'#999'}}>{meta.unit}</small></div>
                                                <span className={`indicator-trend ${delta > 0 ? (meta.higherBetter!==false?'trend-up':'trend-down') : delta < 0 ? (meta.higherBetter!==false?'trend-down':'trend-up') : 'trend-stable'}`}>
                                                    {delta > 0 ? '▲' : delta < 0 ? '▼' : '→'} {delta > 0 ? '+' : ''}{delta}
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div style={{background:'#e8f5e9',border:'2px solid #28a745',borderRadius:'12px',padding:'20px',maxWidth:'700px',margin:'0 auto 30px',textAlign:'left'}}>
                                <strong style={{color:'#1e3c72',display:'block',marginBottom:'10px'}}>🎓 Retour pédagogique</strong>
                                <ul style={{color:'#555',fontSize:'0.9em',lineHeight:'1.8',paddingLeft:'18px'}}>
                                    <li>Quelles décisions ont eu le plus d'impact positif ? Pourquoi ?</li>
                                    <li>Avez-vous bien équilibré décisions stratégiques, tactiques et opérationnelles ?</li>
                                    <li>Comment avez-vous géré les événements imprévus ?</li>
                                    <li>Quel lien faites-vous avec les notions du programme Management STMG ?</li>
                                    <li>Refaites le scénario avec une stratégie différente et comparez les résultats.</li>
                                </ul>
                            </div>

                            <div className="action-buttons">
                                <button className="btn btn-secondary" onClick={backToScenarios}>← Choisir un autre scénario</button>
                                <button className="btn btn-primary" onClick={resetGame}>🔄 Rejouer ce scénario</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return <div>Chargement…</div>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Game />);
    </script>
</body>
</html>
